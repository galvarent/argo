<!DOCTYPE html>
<html lang="it">
<head>

<title>ARGO HQ</title>

<style>
:root{--line:#2a3970;--panel:#121a33;--panel2:#18224a;--ink:#e9f0ff;--dim:#8a97c4;--cyan:#5ee6d0;--px:Silkscreen,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:#070b18;color:var(--ink);font-family:VT323,monospace;font-size:20px;line-height:1.15}
.wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 24px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top h1{font:700 15px var(--px);margin:0;letter-spacing:1px}.top h1 span{color:var(--cyan)}
.top .ora{font:400 11px var(--px);color:var(--dim)}
.top .plancia{font:700 11px var(--px);color:#070b18;background:var(--cyan);padding:6px 10px;text-decoration:none;box-shadow:0 3px 0 #03050c;margin-left:auto;margin-right:10px}
canvas{display:block;width:100%;aspect-ratio:240/336;border:2px solid var(--line);box-shadow:0 4px 0 #03050c;cursor:pointer;touch-action:manipulation}
.box{border:2px solid var(--line);background:var(--panel);box-shadow:0 4px 0 #03050c;margin-top:12px}
.box.argo{border-color:var(--cyan)}
.box .head{padding:6px 8px;font:700 11px var(--px);background:var(--panel2);border-bottom:2px solid var(--line)}
.box.argo .head{color:var(--cyan);border-color:var(--cyan)}
.corpo{padding:10px 12px}
.msg{font-size:22px;white-space:pre-line}
ol{margin:8px 0 0;padding-left:28px}li{margin:3px 0}
.agg{color:var(--dim);font-size:17px;margin-top:8px}
.voce{display:flex;gap:8px;padding:7px 10px;border-bottom:1px dashed var(--line);font-size:19px}
.voce:last-child{border-bottom:0}
.voce b{font:400 10px var(--px);color:var(--cyan);flex:none;width:78px;padding-top:4px}
.voce time{color:var(--dim);font-size:16px}
.vuoto{padding:10px;color:var(--dim)}
.velo{position:fixed;inset:0;background:rgba(3,5,12,.7);display:none;z-index:5}
.scheda{position:fixed;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;max-height:80vh;overflow:auto;z-index:6;background:var(--panel);border:2px solid var(--cyan);border-bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(105%);transition:transform .25s steps(6)}
.aperta .velo{display:block}.aperta .scheda{transform:none}
.scheda h2{font:700 15px var(--px);margin:0 0 2px;display:flex;justify-content:space-between;align-items:center}
.scheda .x{font:700 14px var(--px);color:var(--dim);padding:4px 8px;border:2px solid var(--line)}
.scheda .sub{color:var(--dim)}
.scheda h3{font:400 11px var(--px);color:var(--cyan);margin:14px 0 4px}
.testo{white-space:pre-line;font-size:21px}
.nota{color:var(--dim);font-size:16px;margin-top:14px}
</style>

</div>

<div class="velo" id="velo"></div>

</section>

<script>
(() => {

/* ---------- il team ---------- */
const TEAM = {

const dati = {};
const statoDi = (id) => TEAM[id].arrivo ? 'arrivo' : ((dati[id] && dati[id].stato) || 'pausa');
const SPIA = { lavoro: '#4ade80', pausa: '#fbbf24', errore: '#f87171', arrivo: '#64748b' };

/* ---------- primitive ---------- */
function R(x, y, w, h, col, a) { if (a != null) c.globalAlpha = a; c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); if (a != null) c.globalAlpha = 1; }

function bagliore(cx, cy, r, col, a) { disco(cx, cy, r, col, a * .35); disco(cx, cy, Math.round(r * .66), col, a * .45); disco(cx, cy, Math.round(r * .33), col, a * .6); }
function spr(righe, pal, x, y) {
  x = Math.round(x); y = Math.round(y);
  for (let j = 0; j < righe.length; j++) { const r = righe[j]; for (let i = 0; i < r.length; i++) { const col = pal[r[i]]; if (col) { c.fillStyle = col; c.fillRect(x + i, y + j, 1, 1); } } }
}
function linea(x0, y0, x1, y1, col, sp) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) R(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, sp || 1, sp || 1, col);
}
const rnd = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ---------- scritte 3x5 ---------- */
const GL = { A: '010101111101101', C: '011100100100011', E: '111100110100111', G: '011100101101011', H: '101101111101101', I: '111010010010111', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100', R: '110101110101101', S: '011100010001110', T: '111010010010010', ' ': '000000000000000' };
function scritta(t, x, y, col) { for (const ch of t) { const g = GL[ch] || GL[' ']; for (let k = 0; k < 15; k++) if (g[k] === '1') R(x + k % 3, y + Math.floor(k / 3), 1, 1, col); x += 4; } }
function etichetta(id, cx, y) {
  const t = TEAM[id].nome.toUpperCase(), w = t.length * 4 + 8, x = Math.round(cx - w / 2);
  R(x, y, w, 9, '#070b18', .85); R(x, y, w, 1, '#2a3970'); R(x, y + 8, w, 1, '#2a3970');
  R(x + 2, y + 3, 3, 3, SPIA[statoDi(id)]); scritta(t, x + 7, y + 2, TEAM[id].arrivo ? '#8a97c4' : '#e9f0ff');
}
function zzz(x, y, t) { const z = Math.floor(t / 450) % 3; for (let k = 0; k <= z; k++) { R(x + k * 3, y - k * 3, 2, 1, '#cbd5e1'); R(x + 1 + k * 3, y + 1 - k * 3, 1, 1, '#cbd5e1'); R(x + k * 3, y + 2 - k * 3, 2, 1, '#cbd5e1'); } }

/* ---------- sprite ---------- */
const TESTA_SEG = ['...OOOOOO...', '..OHHHHHHO..', '.OHHHHHHHHO.', '.OHHhSSSHHO.', '.OHSSSSSSHO.', '.OHSESSESHO.', '.OHSSSSSSHO.', '.OHSsMMsSHO.', '.OHOSSSSOHO.', '.OHOOssOOHO.'];
const BUSTO_SEG = ['..OHCWWWWCHO..', '.OHCCCWWCCCHO.', 'OCCCCCCCCCCCCO', 'OCCCCCCCCCCCCO', 'OCcCCCCCCCCcCO', 'OCcCCCCCCCCcCO', 'OCcCCCCCCCCcCO'];
const TESTA_CAP_F = ['...OOOOOO...', '..ORRRRRRO..', '.ORRRWWRRRO.', '.ORRRRRRRRO.', 'OrrrrrrrrrrO', '.OHSSSSSSHO.', '.OSSESSESSO.', '.OSSSSSSSSO.', '.OSBsMMsBSO.', '..OBBBBBBO..'];
const TESTA_CAP_R = ['...OOOOOO...', '..ORRRRRRO..', '.ORRRRRRRRO.', '.ORRRRRRRRO.', '.OrrrrrrrrO.', '.OHHHHHHHHO.', '.OHHHHHHHHO.', '.OShhhhhhSO.', '..OSSSSSSO..', '...OssssO...'];
const BUSTO_F = ['..OORRWWRROO..', '.ORRRRRRRRRRO.', 'ORWORRRRRROWRO', 'ORWORRRRYROWRO', 'ORWORRRRRROWRO', 'ORWORRRRRROWRO', 'OSSOrrrrrrOSSO'];
const BUSTO_SED = ['..OORRWWRROO..', '.ORRRRRRRRRRO.', 'ORWORRRRRROWRO', 'ORWORRRRYROWRO', 'ORWORRRRRROWRO', 'ORWORRRRRROWRO', 'ORWORRRRRROWRO'];
const BUSTO_R = ['..OORRRRRROO..', '.ORRRRRRRRRRO.', '...ORRRRRROWRO', '...ORRWWRROWRO', '...ORRRRRROWRO', '...ORRRRRROWRO', '...OrrrrrrOSSO'];
const GAMBE = ['...OPPPPPPO...', '...OPPOOPPO...', '...OPPOOPPO...', '...OPPOOPPO...', '...OPPOOPPO...'];
const PAL_SEG = { O: '#1a1226', H: '#8a4a22', h: '#6b3615', S: '#f3c9a5', s: '#d9a27e', E: '#22172b', M: '#c2504a', C: '#e8559a', c: '#c23a7e', W: '#fdf2f8' };
const PAL_MIS = { O: '#1a1226', R: '#d92d2d', r: '#a81f1f', W: '#f8fafc', H: '#5a3a1a', h: '#3f2710', S: '#eebb8b', s: '#cf9a6b', E: '#22172b', M: '#9a4a3a', B: '#b98a62', P: '#1e2a4a', Y: '#facc15' };
const PAL_ERM = { O: '#141a2e', R: '#2f5fc4', r: '#1f4391', W: '#facc15', H: '#aab0bd', h: '#8a909d', S: '#f1c9a0', s: '#d4a57c', E: '#22172b', M: '#a85a4a', B: '#f1c9a0', Y: '#facc15' };
const PAL_ORI = { O: '#17150f', R: '#8a6a3a', r: '#5f4722', W: '#e4d3a0', H: '#2e2216', h: '#1f170e', S: '#d9a57a', s: '#b98558', E: '#22172b', M: '#7a3f30', B: '#3b2a1a', Y: '#e4d3a0' };
const GIACCA_ORI = { R: '#5f7a2e', r: '#46591f', W: '#d9c48a', Y: '#d9c48a' };

/* ---------- arredo ---------- */
function ombra(x, y, w) { R(x + 2, y, w - 4, 3, '#000', .22); R(x, y + 1, w, 1, '#000', .12); }
function scrivania(x, y, w, legno, scuro) {
  ombra(x - 1, y + 27, w + 2);
  R(x, y, w, 14, legno); R(x, y, w, 1, '#ffffff', .22); R(x, y + 13, w, 1, '#000', .25);
  R(x, y + 14, w, 12, scuro); R(x, y + 14, w, 1, '#000', .2);
  const cw = Math.min(22, Math.floor(w / 2) - 5);
  R(x + 4, y + 17, cw, 7, '#000', .16); R(x + 4 + Math.floor(cw / 2) - 2, y + 20, 4, 1, '#d6b98a');
  R(x + w - 4 - cw, y + 17, cw, 7, '#000', .16); R(x + w - 4 - Math.floor(cw / 2) - 2, y + 20, 4, 1, '#d6b98a');
  R(x + 1, y + 26, 3, 3, '#3b2412'); R(x + w - 4, y + 26, 3, 3, '#3b2412');
}
function pianta(x, y) {
  ombra(x - 1, y + 13, 12); R(x + 1, y + 6, 8, 8, '#8a4b25'); R(x + 1, y + 6, 8, 2, '#a65f33');
  R(x + 2, y - 6, 6, 12, '#1f8a4c'); R(x, y - 3, 3, 6, '#187a41'); R(x + 7, y - 4, 3, 7, '#26a35b'); R(x + 3, y - 9, 3, 4, '#2fbf6b'); R(x + 5, y - 2, 1, 6, '#0f5a2e');
}
function schedario(x, y) {
  ombra(x - 1, y + 29, 20); R(x, y, 18, 30, '#56637f'); R(x, y, 18, 2, '#7a88a8'); R(x + 17, y, 1, 30, '#3b4660');
  for (let k = 0; k < 3; k++) { R(x + 2, y + 4 + k * 9, 14, 7, '#465270'); R(x + 7, y + 7 + k * 9, 4, 1, '#c9d3ea'); }
}
function libreria(x, y) {
  ombra(x - 1, y + 35, 38); R(x, y, 36, 36, '#5b3a1f'); R(x, y, 36, 2, '#7d5430');
  const col = ['#d92d2d', '#2f6fd9', '#e9b23a', '#2fa36b', '#8b5cf6', '#e8e2d2', '#d9682d'];
  for (let r = 0; r < 3; r++) { R(x + 2, y + 3 + r * 11, 32, 9, '#2c1b0d'); let px = x + 3; for (let k = 0; k < 9 && px < x + 32; k++) { const w = 2 + Math.floor(rnd(r * 9 + k) * 2), h = 6 + Math.floor(rnd(r * 5 + k * 3) * 3); R(px, y + 12 + r * 11 - h, w, h, col[(k + r * 2) % col.length]); px += w + 1; } }
}
function boccione(x, y) {
  ombra(x - 1, y + 27, 12); R(x, y + 10, 10, 18, '#dfe6f2'); R(x, y + 10, 10, 2, '#fff'); R(x + 3, y + 15, 2, 2, '#3b82f6'); R(x + 6, y + 15, 2, 2, '#ef4444');
  R(x + 1, y, 8, 10, '#7cc4f5', .85); R(x + 2, y + 1, 2, 6, '#fff', .5); R(x + 3, y - 2, 4, 2, '#9fd6fb');
}
function scatola(x, y, w, h) { R(x, y, w, h, '#b98a52'); R(x, y, w, 2, '#d3a76e'); R(x + Math.floor(w / 2) - 1, y, 2, h, '#8a6233', .7); R(x + w - 1, y, 1, h, '#000', .2); }
function fogli() { [[118, 150], [128, 236], [112, 246], [226, 240], [6, 238], [132, 196], [104, 100]].forEach(([x, y], i) => { R(x, y, 6, 4, '#e8ecf5', .9); R(x + 1, y + 1, 4, 1, '#9aa5c4'); if (i % 2) R(x + 4, y + 3, 5, 3, '#cfd6e6', .8); }); }
function busta(x, y, col) { R(x, y, 6, 4, '#f4f6fb'); R(x, y, 6, 1, '#c9d0e2'); R(x + 2, y + 1, 2, 1, '#c9d0e2'); R(x + 4, y + 2, 1, 1, col || '#ef4444'); }
function monitor(mx, dy, acceso) { R(mx + 8, dy + 1, 6, 3, '#1b2137'); R(mx + 10, dy - 2, 2, 4, '#2a3352'); R(mx, dy - 20, 22, 18, '#1b2137'); R(mx + 1, dy - 19, 20, 15, acceso ? '#06302c' : '#0c111f'); if (!acceso) R(mx + 10, dy - 12, 2, 2, '#2a3352'); }
function sedia(px, ty) { R(px - 3, ty + 8, 20, 18, '#27335c'); R(px - 3, ty + 8, 20, 2, '#3a4a7e'); R(px - 3, ty + 8, 1, 18, '#1a2342'); }

/* ---------- finestre ---------- */
function finestra(x, y, w, h, seme, t, luna) {
  R(x - 2, y - 2, w + 4, h + 5, '#4d5a86'); R(x - 2, y + h + 2, w + 4, 2, '#6b79a8');
  R(x, y, w, h, '#0a1024'); R(x, y, w, Math.floor(h / 2), '#0d1630'); R(x, y, w, Math.floor(h / 4), '#111d3d');
  for (let k = 0; k < 14; k++) { const sx = x + Math.floor(rnd(seme + k) * w), sy = y + Math.floor(rnd(seme + k * 7) * h * .45); if ((Math.floor(t / 900) + k) % 5) R(sx, sy, 1, 1, '#c7d4ff', .7); }
  if (luna) { disco(x + w - 12, y + 9, 4, '#f4f0d0', 1); disco(x + w - 10, y + 8, 3, '#0d1630', 1); }
  let bx = x;
  for (let k = 0; bx < x + w; k++) {
    const bw = 6 + Math.floor(rnd(seme * 3 + k) * 7), bh = 10 + Math.floor(rnd(seme * 5 + k * 2) * (h - 16)), ww = Math.min(bw, x + w - bx);
    R(bx, y + h - bh, ww, bh, k % 2 ? '#141c3a' : '#182246');
    for (let fy = y + h - bh + 2; fy < y + h - 1; fy += 3) for (let fx = bx + 1; fx < bx + ww - 1; fx += 2) {
      const id = seme * 100 + fx * 13 + fy * 7;
      if (rnd(id) > .55 && rnd(id + Math.floor(t / 4000 + rnd(id) * 9)) > .25) R(fx, fy, 1, 1, rnd(id * 2) > .3 ? '#f6d365' : '#9ad7ff');
    }
    bx += bw;
  }
  R(x + Math.floor(w / 2), y, 1, h, '#4d5a86'); R(x, y + Math.floor(h / 2), w, 1, '#4d5a86');
  R(x, y, w, 1, '#000', .35); R(x + 2, y + 2, 5, 1, '#fff', .12); R(x + 3, y + 4, 3, 1, '#fff', .08);
}

/* ---------- ARGO ---------- */
function argo(t) {
  const x = 94, y = 6;
  R(x - 2, y - 2, 56, 40, '#1b2444'); R(x, y, 52, 36, '#050a18'); R(x, y, 52, 1, '#5ee6d0', .5);

  for (let a = 0; a < 18; a++) { const an = a / 18 * 6.283 + t / 1400; R(cx + Math.cos(an) * (9 + p), cy + Math.sin(an) * (5 + p * .5), 1, 1, a % 3 ? '#5ee6d0' : '#a78bfa'); }
  R(cx - 1, cy - 1, 3, 3, '#5ee6d0'); R(cx, cy, 1, 1, '#f0fffb');
  for (let k = 0; k < 5; k++) { const h = 2 + Math.floor((Math.sin(t / 260 + k * 1.7) * .5 + .5) * 9); R(x + 4 + k * 2, y + 32 - h, 1, h, '#5ee6d0', .8); R(x + 39 + k * 2, y + 32 - (11 - h), 1, 11 - h + 1, '#a78bfa', .8); }
  ombra(86, 73, 68);
  R(88, 48, 64, 9, '#2a3558'); R(88, 48, 64, 1, '#55618c'); R(88, 57, 64, 16, '#1c2440'); R(88, 57, 64, 1, '#000', .3);
  for (let k = 0; k < 14; k++) R(92 + k * 4, 51, 2, 2, (Math.floor(t / 300) + k * 5) % 7 < 4 ? '#5ee6d0' : '#1f6e66');
  for (let k = 0; k < 6; k++) { R(93 + k * 10, 61, 6, 8, '#0f1630'); R(94 + k * 10, 62 + (Math.floor(t / 400) + k) % 5, 4, 1, k % 2 ? '#4ade80' : '#38bdf8'); }
  bagliore(120, 80, 22, '#5ee6d0', .10);
  for (let a = 0; a < 36; a++) { const an = a / 36 * 6.283; if ((a + Math.floor(t / 180)) % 4) R(120 + Math.cos(an) * 20, 176 + Math.sin(an) * 8, 1, 1, '#5ee6d0', .35); }
  for (let a = 0; a < 20; a++) { const an = a / 20 * 6.283 - t / 2600; R(120 + Math.cos(an) * 13, 176 + Math.sin(an) * 5, 1, 1, '#a78bfa', .3); }
}

/* ---------- Penelope, la segretaria ---------- */
function segretaria(t) {
  const lav = statoDi('segretaria') === 'lavoro', dx = 22, dy = 118, px = 52, ty = 93;

      $('argoAgg').textContent = x.aggiornato ? 'Aggiornato ' + quando(x.aggiornato) : '';
    }
    const reg = j.registro || [];
    $('registro').innerHTML = !reg.length ? '<div class="vuoto">Nessun rapporto ancora.</div>' :
      reg.map((v) => { const n = TEAM[v.agente] ? TEAM[v.agente].nome : 'ARGO'; return `<div class="voce"><b>${esc(n)}</b><span>${esc(v.testo)}<br><time>${esc(quando(v.quando))}</time></span></div>`; }).join('');
  } catch (e) {
    if (!Object.keys(dati).length) $('argoMsg').textContent = 'Il quartier generale non risponde. Controlla la connessione e riprova.';
  }
}
carica(); setInterval(() => { if (!document.hidden) carica(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) carica(); });
})();
</script>
