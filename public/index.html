<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARGO">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/argo-icona-180.png">
<link rel="icon" href="/galvarent-mark.svg" type="image/svg+xml">
<title>ARGO – Oggi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --fondo:#0A0A0A;--card:#151515;--card2:#1C1C1C;--linea:#262626;--nav:#101010;
  --ink:#F5F5F5;--testo:#D9DCE1;--tenue:#C4C9D0;--dim:#9CA3AF;
  --rosso:#E83F31;--rosso-btn:#DC3427;--rosso-ch:#FF6A5C;--rosso-fondo:#2A1513;--rosso-bordo:#3A1A17;
  --ambra:#F59E0B;--ambra-fondo:#33240A;--verde:#4ADE80;--verde-fondo:#12261A;--verde-bordo:#1F3D2A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--ink);font:400 16px/1.45 Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rosso-ch);text-decoration:none}
:focus-visible{outline:2px solid var(--rosso-ch);outline-offset:2px}
h1,h2,p{margin:0}

.pagina{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 120px);display:flex;flex-direction:column;gap:22px}
.logo{display:block;height:54px;width:auto;margin:0 0 14px -4px}
.riga-testa{display:flex;align-items:center;gap:12px}
.riga-testa .data{flex:1;font-size:13px;font-weight:500;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.aggiorna{width:44px;height:44px;border-radius:12px;border:1px solid var(--linea);background:transparent;color:var(--dim);display:flex;align-items:center;justify-content:center;flex:none}
.aggiorna.gira svg{animation:gira 1s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:14px}
.argo{font-size:15px;color:var(--tenue);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nascosto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.link{background:none;border:0;padding:8px 0;min-height:44px;color:var(--rosso-ch);font-size:14px;font-weight:500}
/* Prossimo impegno */
.prossimo{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--linea);border-radius:20px;padding:16px}
.prossimo .quando{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--rosso-ch)}
.prossimo .quando.ora{color:var(--verde)}
.prossimo .titolo-p{font-size:20px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.prossimo .dove{font-size:14px;color:var(--dim)}
.prossimo .azioni a{flex:none}
/* Interruttore Oggi / Domani */
.interruttore{display:flex;background:var(--card);border:1px solid var(--linea);border-radius:10px;padding:3px}
.interruttore button{border:0;background:transparent;color:var(--dim);font-size:13px;font-weight:600;padding:0 12px;min-height:34px;border-radius:8px}
.interruttore button[aria-pressed="true"]{background:var(--linea);color:var(--ink)}
.altro{width:100%;background:transparent;border:0;border-top:1px solid var(--linea);color:var(--dim);font-size:13px;min-height:44px}
/* Priorità: nuova */
.nuova-pri{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--linea)}
.nuova-pri input{flex:1;min-width:0;height:44px;background:var(--fondo);border:1px solid var(--linea);border-radius:10px;padding:0 10px;color:var(--ink);font-size:16px}
.mia{font-size:11px;color:var(--dim);margin-left:6px}
.togli{background:none;border:0;color:var(--dim);width:44px;height:44px;flex:none;margin-right:-10px}
.stato{font-size:13px;color:var(--dim);margin-top:8px}
.stato button{background:none;border:0;padding:0;color:var(--rosso-ch);text-decoration:underline}

section{display:flex;flex-direction:column;gap:12px}
.titolo-sez{display:flex;justify-content:space-between;align-items:baseline}
h2,.etichetta{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.titolo-sez a{font-size:14px;font-weight:500}

.scatola{background:var(--card);border:1px solid var(--linea);border-radius:18px;overflow:hidden}
.riga{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--linea);min-height:60px}
.riga:last-child{border-bottom:0}
.corpo{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.tit{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.sotto{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
.ora{font-size:15px;font-weight:600;width:48px;flex:none;font-variant-numeric:tabular-nums}
.freccia{color:#555;flex:none;margin-left:-4px}
.vuoto{padding:16px;color:var(--dim);font-size:14px}
.passato{opacity:.45}
button.riga.evento{width:100%;background:transparent;border:0;border-bottom:1px solid var(--linea);text-align:left;color:inherit;border-radius:0}
button.riga.evento:last-child{border-bottom:0}
button.riga.evento:active{background:var(--card2)}
.lista-canc{display:flex;flex-direction:column;gap:2px;border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.lista-canc label{display:flex;align-items:center;gap:12px;padding:12px;background:var(--fondo);font-size:15px;color:var(--testo);min-height:48px}
.lista-canc input{width:22px;height:22px;accent-color:var(--rosso);flex:none}
.lista-canc .sotto{display:block}

.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;flex:none;background:var(--linea);color:var(--tenue)}
.tag.lavoro{background:var(--rosso-fondo);color:#FF8A7E}
.tag.calcio{background:var(--verde-fondo);color:var(--verde)}
.tag.personale{background:var(--linea);color:var(--tenue)}

/* Barra rapida */
.barra{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:6px 6px 6px 14px}
.barra:focus-within{border-color:var(--rosso-bordo)}
.barra input{flex:1;min-width:0;height:44px;background:transparent;border:0;outline:0;color:var(--ink);font-size:16px}
.barra input::placeholder{color:#7B8390}
.tasto{width:44px;height:44px;flex:none;border-radius:12px;border:0;display:flex;align-items:center;justify-content:center;background:var(--linea)}
.tasto.invio{background:var(--rosso-btn)}
.tasto.ascolta{background:var(--rosso-btn);animation:pulsa 1.2s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 6px rgba(232,63,49,.25)}}
.esempio{font-size:13px;color:var(--dim)}
.nota-g{font-size:13px;color:var(--ambra)}

.proposta{background:var(--card);border:1px solid var(--rosso-bordo);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.proposta .etichetta{color:#FF8A7E}
.dubbi{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.dubbi li{font-size:14px;color:var(--ambra)}
.campi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.campi .tutta{grid-column:1/-1}
.campi label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
.campi input,.campi select{height:44px;background:var(--fondo);border:1px solid var(--linea);border-radius:10px;padding:0 10px;color:var(--ink);font-size:16px;width:100%;min-width:0}
.campi input[type=checkbox]{width:22px;height:22px;accent-color:var(--rosso)}
.spunta{flex-direction:row!important;align-items:center;gap:10px!important;font-size:15px!important;color:var(--testo)!important}
.prima-dopo{display:flex;align-items:center;gap:8px;font-size:15px;flex-wrap:wrap}
.prima-dopo s{color:var(--dim)}
.prima-dopo b{color:var(--ambra)}
.avviso-canc{font-size:14px;color:var(--ambra)}
.azioni{display:flex;gap:8px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--linea);background:transparent;color:var(--tenue);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
.btn.pieno{flex:1;border:0;background:var(--rosso-btn);color:#fff;font-weight:600}
.btn.morbido{background:var(--rosso-fondo);border:0;color:var(--rosso-ch);font-weight:600;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.esito{display:flex;align-items:center;gap:10px;background:var(--verde-fondo);border:1px solid var(--verde-bordo);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--testo)}
.esito.errore{background:var(--ambra-fondo);border-color:#4A350E}

/* Priorità */
.check{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;background:transparent;border:0;padding:0;margin:-10px -6px -10px -10px}
.check span{width:24px;height:24px;border-radius:8px;border:2px solid #404040;display:flex;align-items:center;justify-content:center}
.check[aria-pressed="true"] span{background:var(--rosso-ch);border-color:var(--rosso-ch)}
.fatto .tit{color:var(--dim);text-decoration:line-through}

/* Agenti */
.agenti{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip-ag{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--linea);border-radius:14px;padding:10px 4px;min-height:64px;color:var(--testo);font-size:12px;font-weight:600}
.chip-ag[aria-expanded="true"]{border-color:var(--rosso-bordo);color:var(--ink)}
.chip-ag.errore{border-color:#4A350E}
.rapporto{background:var(--card);border:1px solid var(--linea);border-radius:14px;padding:14px;font-size:14px;color:var(--tenue);display:flex;flex-direction:column;gap:6px}
.rapporto b{color:var(--ink);font-weight:600}
.agente{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:14px;color:var(--ink)}
.agente .nome{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.agente .ruolo{font-weight:400;color:var(--dim);font-size:12px}
.pallino{width:8px;height:8px;border-radius:50%;background:#555;flex:none}
.pallino.lavoro{background:var(--verde)}.pallino.errore{background:var(--ambra)}
.agente p{font-size:13px;color:var(--tenue);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Navigazione */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--nav);border-top:1px solid var(--linea);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 8px)}
nav .voci{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end}
nav a,nav button.mic{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;justify-content:center;font-size:11px;font-weight:500;color:var(--dim);background:none;border:0}
nav a[aria-current="page"]{color:var(--rosso-ch);font-weight:600}
nav a.mic,nav button.mic{}
nav button.mic span.cerchio{width:60px;height:60px;border-radius:50%;background:var(--rosso);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 0 0 6px var(--fondo),0 0 28px rgba(232,63,49,.35)}
nav button.mic.ascolta span.cerchio{animation:pulsa 1.2s ease-in-out infinite}
.avviso{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:var(--rosso-btn);color:#fff;font-weight:600;padding:10px 14px;border-radius:12px;z-index:9;max-width:90vw;display:none;font-size:14px}
.avviso.errore{background:var(--ambra);color:#1a1205}
@media (prefers-reduced-motion:reduce){.tasto.ascolta,nav button.mic.ascolta span.cerchio{animation:none}}
</style>
</head>
<body>
<main class="pagina">
  <header class="testa">
    <div class="riga-testa">
      <img class="logo" src="/galvarent.svg" alt="GalvaRent" width="56" height="41">
      <span class="data" id="data"></span>
      <button type="button" class="aggiorna" id="aggiorna" aria-label="Aggiorna"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>
    <h1>Ciao Andrea</h1>
    <p class="argo" id="argo">Carico la giornata…</p>
  </header>

  <section aria-label="Prossimo impegno" id="prossimo"></section>

  <section aria-label="Aggiungi o cambia">
    <form class="barra" id="barra" autocomplete="off">
      <label class="nascosto" for="rapida">Aggiungi o cambia</label>
      <input id="rapida" name="frase" type="text" enterkeyhint="send" placeholder="Aggiungi o cambia un impegno…">
      <button type="submit" class="tasto invio" aria-label="Invia ad ARGO">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <p class="nota-g" id="notaGoogle" hidden></p>
    <div id="proposta" aria-live="polite"></div>
  </section>

  <section aria-labelledby="h-pri">
    <div class="titolo-sez"><h2 id="h-pri">Priorità</h2><button type="button" class="link" id="aggPri">+ Aggiungi</button></div>
    <div class="scatola" id="priorita"></div>
  </section>

  <section aria-labelledby="h-ag">
    <div class="titolo-sez">
      <h2 id="h-ag">Agenda</h2>
      <div class="interruttore" role="group" aria-label="Giorno">
        <button type="button" data-giorno="0" aria-pressed="true">Oggi</button><button type="button" data-giorno="1" aria-pressed="false">Domani</button>
      </div>
    </div>
    <div class="scatola" id="agenda"><div class="vuoto">Carico…</div></div>
  </section>

  <section aria-labelledby="h-fu" id="sezFollow">
    <div class="titolo-sez"><h2 id="h-fu">Da fare</h2><a href="/crm#clienti">Clienti</a></div>
    <div class="scatola" id="follow"></div>
  </section>

  <section aria-labelledby="h-team">
    <h2 id="h-team">Agenti</h2>
    <div class="agenti" id="agenti"></div>
    <div id="rapporto"></div>
  </section>
</main>

<nav aria-label="Sezioni"><div class="voci">
  <a href="/" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Oggi</a>
  <a href="/crm#clienti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14l-1.5-5.5A2 2 0 0 0 15.6 10H8.4a2 2 0 0 0-1.9 1.5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>Clienti</a>
  <button class="mic" id="micGrande" type="button" aria-label="Parla con ARGO"><span class="cerchio"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></span></button>
  <a href="/crm#calcio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/></svg>Calcio</a>
  <a href="/crm#chiamate"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Chiamate</a>
</div></nav>
<div class="avviso" id="avviso" role="status"></div>

<script src="/js/parser.js"></script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TZ = 'Europe/Rome';
const fOra = new Intl.DateTimeFormat('it-IT', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const fLungo = new Intl.DateTimeFormat('it-IT', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
const fGiorno = new Intl.DateTimeFormat('it-IT', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' });
const fBreve = new Intl.DateTimeFormat('it-IT', { timeZone: TZ, day: 'numeric', month: 'short' });
const P = window.ArgoParser;
const chiave = P.chiaveRoma;
const NOMI_CAL = { lavoro: 'GalvaRent', calcio: 'Calcio', personale: 'Personale' };
const AGENTI = [['segretaria', 'Penelope', 'Segretaria'], ['postino', 'Ermes', 'Postino'], ['cacciatore', 'Orione', 'Cacciatore'], ['mister', 'Chirone', 'Mister'], ['sponsor', 'Pluto', 'Sponsor Marga TV'], ['social', 'Calliope', 'Social GalvaRent']];

let D = null, proposta = null, ultimo = 0;
const oggi = () => (D && D.oggi) || P.oggiRoma();
const daChiave = (k) => new Date(k + 'T12:00:00Z');
const giornoTesto = (k) => (k === oggi() ? 'Oggi' : k === P.piuGiorni(oggi(), 1) ? 'Domani' : fGiorno.format(daChiave(k)));
const oraTesto = (e) => (e.tutto_giorno ? 'Giorno' : fOra.format(new Date(e.inizio)));

// ---------- Dati ----------
async function carica() {
  try {
    const r = await fetch('/api/crm', { headers: { Accept: 'application/json' } });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Errore ' + r.status);
    D = j; ultimo = Date.now();
    disegna();
  } catch (e) {
    $('argo').textContent = 'Non riesco a caricare i dati: ' + e.message;
  }
  stato();
}
async function invia(op, payload) {
  const r = await fetch('/api/crm', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Argo': '1' }, body: JSON.stringify({ op, ...payload }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Operazione non riuscita');
  return j.dato;
}
let tAvviso;
function avvisa(testo, errore) {
  const a = $('avviso'); a.textContent = testo; a.className = 'avviso' + (errore ? ' errore' : ''); a.style.display = 'block';
  clearTimeout(tAvviso); tAvviso = setTimeout(() => { a.style.display = 'none'; }, errore ? 5000 : 2400);
}
function stato() {
  $('aggiorna').classList.remove('gira');
  if (ultimo) $('aggiorna').title = 'Aggiornato alle ' + fOra.format(new Date(ultimo));
}

// ---------- Disegno ----------
function rigaEvento(e) {
  const passato = new Date(e.fine || e.inizio) < new Date() && !e.tutto_giorno;
  return `<button type="button" class="riga evento${passato ? ' passato' : ''}" data-ev="${esc(e.id)}" aria-label="${esc(e.titolo)}: sposta o elimina"><span class="ora">${oraTesto(e)}</span>
    <span class="corpo"><span class="tit">${esc(e.titolo)}</span>${e.luogo ? `<span class="sotto">${esc(e.luogo)}</span>` : ''}</span>
    <span class="tag ${esc(e.calendario)}">${esc(NOMI_CAL[e.calendario] || e.calendario)}</span>
    <svg class="freccia" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>`;
}
const elenco = (righe, vuoto) => (righe.length ? righe.join('') : `<div class="vuoto">${vuoto}</div>`);
const eventiDi = (k) => (D.agenda || []).filter((e) => chiave(e.inizio) === k);

function disegna() {
  $('data').textContent = fLungo.format(new Date());
  const capo = (D.hq && D.hq.capo) || {};

const chiavePri = () => 'argo-pri-' + oggi();

// ---------- Prossimo impegno ----------
function disegnaProssimo() {
  const ora = Date.now();
  const lista = (D.agenda || []).filter((e) => !e.tutto_giorno && new Date(e.fine || e.inizio).getTime() > ora)
    .sort((a, b) => new Date(a.inizio) - new Date(b.inizio));
  const e = lista[0];
  const box = $('prossimo');
  if (!e) { box.innerHTML = ''; box.hidden = true; return; }
  box.hidden = false;
  const inizio = new Date(e.inizio).getTime();
  const min = Math.round((inizio - ora) / 60000);
  let quando, classe = '';
  if (min <= 0) { quando = 'In corso · fino alle ' + (e.fine ? fOra.format(new Date(e.fine)) : '—'); classe = ' ora'; }
  else if (min < 60) quando = `Tra ${min} min · ${fOra.format(new Date(inizio))}`;
  else if (chiave(e.inizio) === oggi()) quando = `Oggi alle ${fOra.format(new Date(inizio))}`;
  else quando = `${giornoTesto(chiave(e.inizio))} alle ${fOra.format(new Date(inizio))}`;
  const mappa = e.luogo ? `https://maps.apple.com/?q=${encodeURIComponent(e.luogo)}` : '';
  box.innerHTML = `<div class="prossimo"><span class="quando${classe}">${esc(quando)}</span>
    <span class="titolo-p">${esc(e.titolo)}</span>${e.luogo ? `<span class="dove">${esc(e.luogo)}</span>` : ''}
    <div class="azioni">${mappa ? `<a class="btn morbido" href="${esc(mappa)}" target="_blank" rel="noopener">Indicazioni</a>` : ''}<button type="button" class="btn" data-ev="${esc(e.id)}">Sposta o elimina</button></div></div>`;
}

// ---------- Agenda ----------
let giorno = null, mostraPassati = false;
function disegnaAgenda() {
  if (giorno === null) {
    // Prima delle 18 mostro oggi; dopo, o se oggi non resta niente, domani.
    const h = Number(new Intl.DateTimeFormat('it-IT', { timeZone: TZ, hour: '2-digit', hour12: false }).format(new Date()));
    const restano = eventiDi(oggi()).some((e) => e.tutto_giorno || new Date(e.fine || e.inizio) > new Date());
    giorno = (h >= 18 || !restano) ? 1 : 0;
  }
  document.querySelectorAll('[data-giorno]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.giorno) === giorno)));
  const k = P.piuGiorni(oggi(), giorno);
  const tutti = eventiDi(k).slice().sort((a, b) => new Date(a.inizio) - new Date(b.inizio));
  const adesso = new Date();
  const passati = giorno === 0 ? tutti.filter((e) => !e.tutto_giorno && new Date(e.fine || e.inizio) < adesso) : [];
  const visibili = mostraPassati ? tutti : tutti.filter((e) => !passati.includes(e));
  let html = elenco(visibili.map(rigaEvento), giorno === 0 ? (passati.length ? 'Niente altro per oggi.' : 'Giornata libera.') : 'Niente in agenda.');
  if (passati.length) html += `<button type="button" class="altro" id="passati">${mostraPassati ? 'Nascondi quelli passati' : `Mostra ${passati.length === 1 ? 'quello passato' : `i ${passati.length} passati`}`}</button>`;
  $('agenda').innerHTML = html;
}

function esito(testo, errore) {
  $('proposta').innerHTML = `<div class="esito${errore ? ' errore' : ''}" role="status">
    ${errore ? '' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>'}
    <span>${esc(testo)}</span></div>`;
}

async function conferma(f) {
  const az = f.dataset.azione;
  const v = Object.fromEntries(new FormData(f).entries());
  const b = f.querySelector('[type=submit]'); b.disabled = true;
  try {
    if (az === 'crea') {
      if (!String(v.titolo || '').trim()) throw new Error('Manca il titolo');
      const ev = await invia('cal_crea', { titolo: v.titolo, data: v.data, ora: v.ora || '', oraFine: v.oraFine || '', calendario: v.calendario, luogo: v.luogo || '', promemoria: Boolean(v.promemoria) });
      D.agenda.push(ev); D.agenda.sort((x, y) => x.inizio.localeCompare(y.inizio));
      disegna(); proposta = null;
      esito(`Aggiunto in ${NOMI_CAL[ev.calendario]}: ${ev.titolo}, ${giornoTesto(chiave(ev.inizio)).toLowerCase()}${ev.tutto_giorno ? '' : ' alle ' + fOra.format(new Date(ev.inizio))}`);
    } else if (az === 'sposta') {
      if (!v.id) throw new Error('Scegli l\'evento da spostare');
      const ev = await invia('cal_sposta', { id: v.id, data: v.data, ora: v.ora || '', oraFine: v.oraFine || '' });
      const i = D.agenda.findIndex((x) => x.id === v.id); if (i >= 0) D.agenda[i] = ev; else D.agenda.push(ev);
      D.agenda.sort((x, y) => x.inizio.localeCompare(y.inizio));
      disegna(); proposta = null;
      esito(`Spostato: ${ev.titolo}, ${giornoTesto(chiave(ev.inizio)).toLowerCase()}${ev.tutto_giorno ? '' : ' alle ' + fOra.format(new Date(ev.inizio))}`);
    } else {
      const ids = new FormData(f).getAll('ids').filter(Boolean);
      if (!ids.length) throw new Error('Spunta almeno un evento');
      const tolti = [];
      for (const id of ids) {
        const vecchio = D.agenda.find((x) => x.id === id);
        await invia('cal_annulla', { id });
        D.agenda = D.agenda.filter((x) => x.id !== id);
        tolti.push(vecchio ? vecchio.titolo : 'evento');
      }
      disegna(); proposta = null;
      esito(`Eliminato: ${tolti.join(', ')}`);
    }
    $('rapida').value = '';
  } catch (e) {
    b.disabled = false;
    avvisa(e.message, true);
  }
}

function apriEvento(id) {
  const e = (D.agenda || []).find((x) => x.id === id); if (!e) return;
  proposta = { azione: 'annulla', bersaglio: e, bersagli: [e], dubbi: String(e.id).startsWith('g:') ? [] : ['Questo evento è nella copia salvata, non in Google: si potrà eliminare dopo il collegamento.'], daRiga: e.id };
  disegnaProposta();
  $('proposta').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---------- Voce ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let ascolto = null;
function detta() {
  if (!SR) { $('rapida').focus(); avvisa('Usa il microfono della tastiera per dettare', false); return; }
  if (ascolto) { ascolto.stop(); return; }
  const rec = new SR();
  rec.lang = 'it-IT'; rec.interimResults = true; rec.maxAlternatives = 1;
  ascolto = rec;
  segnaAscolto(true);
  let finale = '';
  rec.onresult = (ev) => {
    let t = '';
    for (let i = 0; i < ev.results.length; i++) { t += ev.results[i][0].transcript; if (ev.results[i].isFinal) finale = t; }
    $('rapida').value = t;
  };
  rec.onerror = (ev) => { if (ev.error !== 'aborted' && ev.error !== 'no-speech') avvisa(ev.error === 'not-allowed' ? 'Consenti il microfono nelle impostazioni del browser' : 'Non ho sentito bene, riprova', true); };
  rec.onend = () => { ascolto = null; segnaAscolto(false); const t = (finale || $('rapida').value).trim(); if (t) analizza(t); };
  try { rec.start(); } catch { ascolto = null; segnaAscolto(false); }
}
function segnaAscolto(si) {
  $('micGrande').classList.toggle('ascolta', si);
  $('micGrande').setAttribute('aria-label', si ? 'Ferma la dettatura' : 'Parla con ARGO');
  $('rapida').placeholder = si ? 'Ti ascolto…' : 'Aggiungi o cambia un impegno…';
}

// ---------- Eventi ----------
$('barra').addEventListener('submit', (ev) => { ev.preventDefault(); const t = $('rapida').value.trim(); if (t) analizza(t); });
$('micGrande').addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); detta(); });
document.addEventListener('submit', (ev) => {
  if (ev.target.id === 'formProposta') { ev.preventDefault(); conferma(ev.target); }
  if (ev.target.id === 'formPri') {
    ev.preventDefault();
    const testo = $('testoPri').value.trim();
    if (testo) scrivi('argo-mie', [...mie(), { id: 'm' + Date.now(), testo }]);
    nuovaPri = false; disegnaPriorita();
  }
});
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.id === 'aggiorna') { t.classList.add('gira'); return carica(); }
  if (t.id === 'aggPri') { nuovaPri = !nuovaPri; return disegnaPriorita(); }
  if (t.dataset.togli) { scrivi('argo-mie', mie().filter((m) => m.id !== t.dataset.togli)); return disegnaPriorita(); }
  if (t.dataset.giorno !== undefined) { giorno = Number(t.dataset.giorno); mostraPassati = false; return disegnaAgenda(); }
  if (t.id === 'passati') { mostraPassati = !mostraPassati; return disegnaAgenda(); }
  if (t.dataset.agente) { agenteAperto = agenteAperto === t.dataset.agente ? null : t.dataset.agente; return disegnaAgenti(); }
  if (t.id === 'annullaProposta') { proposta = null; disegnaProposta(); return; }
  if (t.dataset.ev) return apriEvento(t.dataset.ev);
  if (t.id === 'spostaInvece') {
    const e = (D.agenda || []).find((x) => x.id === t.dataset.id); if (!e) return;
    proposta = { azione: 'sposta', bersaglio: e, dubbi: [], titolo: e.titolo, calendario: e.calendario, luogo: e.luogo || '',
      data: chiave(e.inizio), ora: e.tutto_giorno ? '' : fOra.format(new Date(e.inizio)), oraFine: e.fine ? fOra.format(new Date(e.fine)) : '' };
    disegnaProposta(); return;
  }
  if (t.dataset.pri !== undefined) {
    const i = t.dataset.pri; const f = leggiFatte();
    scriviFatte(f.includes(i) ? f.filter((x) => x !== i) : [...f, i]);
    disegnaPriorita();
  }
});
document.addEventListener('change', (ev) => {
  // Cambiando l'evento da spostare, riprendo i suoi orari se la frase non ne indicava di nuovi.
  const f = ev.target.form;
  if (!f || f.id !== 'formProposta' || ev.target.name !== 'id' || f.dataset.azione !== 'sposta') return;
  const e = (D.agenda || []).find((x) => x.id === ev.target.value);
  if (!e) return;
  proposta.bersaglio = e;
  if (!proposta.ora && !e.tutto_giorno) {
    f.elements.ora.value = fOra.format(new Date(e.inizio));
    if (e.fine) f.elements.oraFine.value = fOra.format(new Date(e.fine));
  }
});
setInterval(() => { if (D) disegnaProssimo(); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - ultimo > 5 * 60000) carica(); });

$('data').textContent = fLungo.format(new Date());
if (location.hash === '#rapida') { history.replaceState(null, '', '/'); $('rapida').focus(); }
carica();
})();
</script>
