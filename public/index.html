<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARGO</title>
<meta name="theme-color" content="#02040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARGO">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed deep-space canvas; HUD floats on top — wordmark + clock at top centre,
   four priority tabs pinned to the corners of the core stage, transcript + actions docked at the bottom. */
:root{
  --void:#02040a; --glass:rgba(8,18,30,.72); --line:rgba(120,255,226,.16);
  --bio:#4cffd2; --bio-dim:#2c8f7c; --violet:#9b7bff;
  --p1:#ff4f8b; --p2:#ffc35c; --p3:#4cffd2; --p4:#9b7bff;
  --text:#d8f6f0; --mute:#6f8f93;
  --f-brand:"Syncopate","Segoe UI",system-ui,sans-serif;
  --f-ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--text);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#space{position:fixed;inset:0;width:100%;height:100%;display:block}
.app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;max-width:820px;margin:0 auto;
  padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{text-align:center;display:grid;gap:2px;pointer-events:none}
.brand{font-family:var(--f-brand);font-weight:700;font-size:1.15rem;letter-spacing:.7em;margin-right:-.7em;color:var(--bio);text-shadow:0 0 18px rgba(76,255,210,.45)}
.sub{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.32em;color:var(--mute)}
.clock{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;color:var(--text);font-variant-numeric:tabular-nums}
.clock span{color:var(--mute)}

.stage{position:relative;min-height:0}
#core{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.status{position:absolute;left:0;right:0;bottom:0;text-align:center;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.34em;text-transform:uppercase;color:var(--bio-dim);pointer-events:none}
.status.on{color:var(--bio);text-shadow:0 0 10px rgba(76,255,210,.5)}

/* corner priority tabs */
.tab{position:absolute;z-index:3;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text);
  background:var(--glass);border:1px solid var(--line);padding:7px 9px 7px 8px;cursor:pointer;display:flex;align-items:center;gap:7px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:46%}
.tab .n{font-family:var(--f-brand);font-weight:700;font-size:.78rem;letter-spacing:0;color:var(--c)}
.tab .pip{width:6px;height:6px;background:var(--c);box-shadow:0 0 10px var(--c);flex:none;transform:rotate(45deg)}
.tab .top{display:block;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.02em;text-transform:none;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16ch}
.tab .lbl{display:grid;gap:1px;min-width:0}
.tab.tl{top:0;left:0;clip-path:polygon(0 0,100% 0,100% 70%,88% 100%,0 100%)}
.tab.tr{top:0;right:0;clip-path:polygon(0 0,100% 0,100% 100%,12% 100%,0 70%)}
.tab.bl{bottom:18px;left:0;clip-path:polygon(0 0,88% 0,100% 30%,100% 100%,0 100%)}
.tab.br{bottom:18px;right:0;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%,0 30%)}
.tab.tr,.tab.br{flex-direction:row-reverse;text-align:right}
.tab:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.tab[data-p="1"]{--c:var(--p1)} .tab[data-p="2"]{--c:var(--p2)} .tab[data-p="3"]{--c:var(--p3)} .tab[data-p="4"]{--c:var(--p4)}
.tab.pulse{animation:pulse .9s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 14px transparent}}

/* task sheet */
.sheet{position:absolute;z-index:5;inset:8% 0 auto 0;margin:0 auto;width:min(420px,100%);background:rgba(5,12,22,.94);border:1px solid var(--line);
  border-top:2px solid var(--c);padding:14px;display:grid;gap:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  clip-path:polygon(0 0,94% 0,100% 5%,100% 100%,6% 100%,0 95%)}
.sheet[hidden]{display:none}
.sheet[data-p="1"]{--c:var(--p1)} .sheet[data-p="2"]{--c:var(--p2)} .sheet[data-p="3"]{--c:var(--p3)} .sheet[data-p="4"]{--c:var(--p4)}
.sheet h2{margin:0;font-family:var(--f-brand);font-size:.78rem;letter-spacing:.4em;color:var(--c);display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;background:none;border:0;color:var(--mute);cursor:pointer;padding:4px}
.sheet ul{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:44vh;overflow-y:auto}
.sheet li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 2px;border-bottom:1px solid rgba(120,255,226,.07)}
.sheet li.done .tx{color:var(--mute);text-decoration:line-through}
.sheet .tx{font-size:.98rem;line-height:1.35;overflow-wrap:anywhere;min-width:0}
.sheet .tx small{display:block;font-family:var(--f-mono);font-size:.62rem;color:var(--mute);margin-top:2px}
.chk{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:2px 0 0;border:1px solid var(--c);transform:rotate(45deg) scale(.8);cursor:pointer;background:transparent}
.chk:checked{background:var(--c);box-shadow:0 0 10px var(--c)}
.mv{font-family:var(--f-mono);font-size:.62rem;background:none;border:1px solid var(--line);color:var(--mute);padding:3px 6px;cursor:pointer}
.empty{color:var(--mute);font-size:.85rem;padding:6px 0}
.addrow{display:flex;gap:8px}
.sheet .foot{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.62rem;color:var(--mute)}
.sheet .foot button{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;text-decoration:underline}

/* bottom dock */
.dock{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px;background:linear-gradient(to top,rgba(2,4,10,.92),rgba(2,4,10,.4))}
.heard{min-height:2.6em;max-height:18vh;overflow-y:auto;font-size:1.05rem;line-height:1.45;overflow-wrap:anywhere;text-align:center}
.heard.idle{color:var(--mute);font-size:.9rem}
.interim{color:var(--mute)}
.you{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;color:var(--mute);margin-bottom:4px}
.you::before{content:"› "}
.btn[aria-pressed="false"]{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--f-ui);font-weight:600;letter-spacing:.14em;font-size:.76rem;text-transform:uppercase;padding:10px 14px;cursor:pointer;
  border:1px solid var(--line);background:rgba(8,18,30,.6);color:var(--text);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.btn.primary{background:var(--bio);color:#021310;border-color:var(--bio)}
.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible,.mv:focus-visible,input:focus-visible,.chk:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
form{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:rgba(8,18,30,.8);border:1px solid var(--line);color:var(--text);font-family:var(--f-ui);font-size:1rem;padding:10px}
.note{font-family:var(--f-mono);font-size:.62rem;color:var(--mute);line-height:1.5;text-align:center;margin:0;min-height:1em}
.note.warn{color:var(--p2)}
@media (prefers-reduced-motion:reduce){.tab.pulse{animation:none}}
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <div class="brand">ARGO</div>
    <div class="sub">ASSISTENTE REMOTO GALVANO OPERATIVO</div>
    <div class="clock"><b id="time">--:--</b> <span id="date"></span></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="core" role="button" tabindex="0" aria-label="Tocca il nucleo per parlare con ARGO"></canvas>
    <button class="tab tl" data-p="1" aria-label="Attività critiche"><i class="pip"></i><span class="lbl">Critico <span class="top"></span></span><b class="n">0</b></button>
    <button class="tab tr" data-p="2" aria-label="Attività di oggi"><i class="pip"></i><span class="lbl">Oggi <span class="top"></span></span><b class="n">0</b></button>
    <button class="tab bl" data-p="3" aria-label="Attività della settimana"><i class="pip"></i><span class="lbl">Settimana <span class="top"></span></span><b class="n">0</b></button>
    <button class="tab br" data-p="4" aria-label="Attività in sospeso"><i class="pip"></i><span class="lbl">In sospeso <span class="top"></span></span><b class="n">0</b></button>
    <div class="status" id="status">Tocca il nucleo</div>
    <section class="sheet" id="sheet" hidden aria-live="polite">
      <h2><span id="sheetTitle"></span><button id="close" aria-label="Chiudi">CHIUDI ✕</button></h2>
      <ul id="list"></ul>
      <form class="addrow" id="addForm"><input type="text" id="addInput" autocomplete="off" placeholder="Nuova attività…" aria-label="Nuova attività"><button class="btn" type="submit">+</button></form>
      <div class="foot"><span>Salvate su questo dispositivo</span><button id="purge">Rimuovi completate</button></div>
    </section>
  </div>

  <div class="dock">
    <div class="heard idle" id="heard" aria-live="polite"></div>
    <div class="row">
      <button class="btn" id="voice" aria-pressed="true">Voce on</button>
      <button class="btn" id="send" disabled>Apri in Claude</button>
      <button class="btn" id="clear" disabled aria-label="Nuova conversazione">✕</button>
    </div>
    <form id="typed"><input type="text" id="q" autocomplete="off" placeholder="…oppure scrivi ad ARGO" aria-label="Messaggio per ARGO"><button class="btn" type="submit">OK</button></form>
    <p class="note" id="note"></p>
  </div>
</div>

<script>
(() => {
  const TZ="Europe/Rome", PROJECT="https://claude.ai/project/01a1961b-5665-775d-a03e-5b0b09137490";
  const $=id=>document.getElementById(id);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let history=[],busy=false;
  const PNAME={1:"Critico",2:"Oggi",3:"Settimana",4:"In sospeso"};
  const PCOL={1:[255,79,139],2:[255,195,92],3:[76,255,210],4:[155,123,255]};

  /* ---------- clock ---------- */
  function tick(){const d=new Date();
    $("time").textContent=d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit",timeZone:TZ});
    $("date").textContent=d.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short",timeZone:TZ}).toUpperCase();}
  tick(); setInterval(tick,10000);
  const hr=Number(new Date().toLocaleString("en-GB",{hour:"2-digit",hour12:false,timeZone:TZ}));
  const greeting=(hr<13?"Buongiorno":hr<18?"Buon pomeriggio":"Buonasera")+", Andrea. Tocca il nucleo e parla.";

  /* ---------- tasks (stored on this device) ---------- */
  const KEY="argo-tasks-v1";
  const SEED=[
    {t:"Corso FIGC: 1,5 h di studio (scadenza 16/11)",p:1},
    {t:"21/11: chi porta i Pulcini ad Arcellasco alle 16:30?",p:1},
    {t:"Chiamate e follow-up clienti NLT",p:2},
    {t:"Post social US Tavernola",p:2},
    {t:"Inserire calendario partite FC Chiasso",p:3},
    {t:"Regola di inoltro Outlook → Gmail",p:3},
    {t:"Hostinger: capire quale sito è offline",p:3},
    {t:"Lista clienti NLT aperti per ARGO",p:4},
    {t:"Collegare l'altra casella mail",p:4}
  ];
  let tasks=[];
  function load(){try{const raw=localStorage.getItem(KEY);tasks=raw?JSON.parse(raw):null;}catch(e){tasks=null;}
    if(!Array.isArray(tasks)){tasks=SEED.map((s,i)=>({id:Date.now()+i,t:s.t,p:s.p,done:false,at:Date.now()}));save();}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch(e){}}
  load();
  function open(p){return tasks.filter(x=>x.p===p&&!x.done);}
  function renderTabs(){
    document.querySelectorAll(".tab").forEach(b=>{const p=+b.dataset.p,o=open(p);
      b.querySelector(".n").textContent=o.length; b.querySelector(".top").textContent=o[0]?o[0].t:"—";});
  }
  let current=null;
  function renderSheet(){
    if(current==null) return;
    const sh=$("sheet"); sh.dataset.p=current; $("sheetTitle").textContent=PNAME[current].toUpperCase();
    const ul=$("list"); ul.textContent="";
    const items=tasks.filter(x=>x.p===current).sort((a,b)=>a.done-b.done||a.at-b.at);
    if(!items.length){const li=document.createElement("li");li.className="empty";li.textContent="Nessuna attività. Aggiungila qui sotto o dilla ad ARGO.";ul.append(li);}
    for(const it of items){
      const li=document.createElement("li"); if(it.done) li.className="done";
      const c=document.createElement("input");c.type="checkbox";c.className="chk";c.checked=it.done;c.id="t"+it.id;c.setAttribute("aria-label","Completata: "+it.t);
      c.addEventListener("change",()=>{it.done=c.checked;save();renderTabs();renderSheet();});
      const tx=document.createElement("label");tx.className="tx";tx.htmlFor=c.id;tx.textContent=it.t;
      const sm=document.createElement("small");sm.textContent=new Date(it.at).toLocaleDateString("it-IT",{day:"numeric",month:"short",timeZone:TZ});tx.append(sm);
      const mv=document.createElement("button");mv.className="mv";mv.type="button";mv.textContent=it.p>1?"↑ P"+(it.p-1):"↓ P2";
      mv.title="Cambia priorità";mv.addEventListener("click",()=>{it.p=it.p>1?it.p-1:2;save();renderTabs();renderSheet();});
      li.append(c,tx,mv); ul.append(li);
    }
  }
  function openSheet(p){current=p;$("sheet").hidden=false;renderSheet();}
  function closeSheet(){current=null;$("sheet").hidden=true;}
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{const p=+b.dataset.p;current===p?closeSheet():openSheet(p);}));
  $("close").addEventListener("click",closeSheet);
  $("purge").addEventListener("click",()=>{tasks=tasks.filter(x=>!(x.p===current&&x.done));save();renderTabs();renderSheet();});
  $("addForm").addEventListener("submit",e=>{e.preventDefault();const v=$("addInput").value.trim();if(!v)return;addTask(v,current);$("addInput").value="";});
  addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
  function addTask(text,p){tasks.push({id:Date.now(),t:text,p,done:false,at:Date.now()});save();renderTabs();renderSheet();
    const tab=document.querySelector(`.tab[data-p="${p}"]`);tab.classList.remove("pulse");void tab.offsetWidth;tab.classList.add("pulse");flash(PCOL[p]);}
  renderTabs();

  /* voice command: "aggiungi [urgente|oggi|settimana|in sospeso] ..." */
  function parseAdd(text){
    const m=text.trim().match(/^(?:argo[,\s]+)?(?:aggiungi|nuova attivit[aà]|ricordami di|segna)\s+(.*)$/i); if(!m) return null;
    let rest=m[1], p=2;
    const rules=[[1,/^(?:alla\s+)?(?:urgente|critic[oa]|priorit[aà]\s+alta|alta\s+priorit[aà])[:,]?\s+/i],
                 [2,/^(?:per\s+)?oggi[:,]?\s+/i],
                 [3,/^(?:in\s+|per\s+la\s+|questa\s+)?settimana[:,]?\s+/i],
                 [4,/^(?:in\s+sospeso|in\s+attesa|bassa\s+priorit[aà]|priorit[aà]\s+bassa)[:,]?\s+/i]];
    for(const [pp,re] of rules){if(re.test(rest)){p=pp;rest=rest.replace(re,"");break;}}
    rest=rest.replace(/\s+(urgente|per oggi|questa settimana|in sospeso)$/i,(s,w)=>{p=/urgente/i.test(w)?1:/oggi/i.test(w)?2:/settimana/i.test(w)?3:4;return "";}).trim();
    if(!rest) return null; return {t:rest.charAt(0).toUpperCase()+rest.slice(1),p};
  }
  let voiceOn=true;try{voiceOn=localStorage.getItem("argo-voice")!=="0";}catch(e){}
  function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^it/i.test(v.lang));
    return vs.find(v=>/luca|alice|federica|paola|enhanced|premium/i.test(v.name))||vs[0];}
  function speak(t,done){
    if(!voiceOn||!("speechSynthesis" in window)){done&&done();return;}
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*#_`>|]/g," "));u.lang="it-IT";u.rate=1.06;u.pitch=.82;
      const v=pickVoice();if(v)u.voice=v;
      u.onstart=()=>setMode("speak","ARGO parla");u.onend=u.onerror=()=>{done&&done();};speechSynthesis.speak(u);
      setTimeout(()=>{if(!speechSynthesis.speaking&&mode==="speak"){done&&done();}},4000);}catch(e){done&&done();}}

  /* ---------- deep space background ---------- */
  const sp=$("space"),sx=sp.getContext("2d"); let SW=0,SH=0,stars=[];
  function sizeSpace(){const dpr=Math.min(2,devicePixelRatio||1);SW=innerWidth;SH=innerHeight;sp.width=SW*dpr;sp.height=SH*dpr;sx.setTransform(dpr,0,0,dpr,0,0);
    stars=Array.from({length:Math.round(SW*SH/2600)},()=>({x:Math.random()*SW,y:Math.random()*SH,z:Math.random(),tw:Math.random()*6.28}));}
  sizeSpace(); addEventListener("resize",()=>{sizeSpace();sizeCore();});

  /* ---------- alien core ---------- */
  const cv=$("core"),ctx=cv.getContext("2d"); let W=0,H=0;
  function sizeCore(){const dpr=Math.min(2,devicePixelRatio||1),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  sizeCore();
  const N=700,pts=[],ga=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,rad=Math.sqrt(1-y*y),th=ga*i;pts.push({x:Math.cos(th)*rad,y,z:Math.sin(th)*rad,s:Math.random()*6.28});}
  const GLYPHS="⟟⏃⌖⍜⋔⏁⟒⍀⎍⟊⌰⍙⏚⎅⟟⊑⍾⋏⌇⏃⍀⟒".split("");
  const ring=Array.from({length:40},()=>GLYPHS[(Math.random()*GLYPHS.length)|0]);
  const moons=[{a:1.9,b:.55,sp:.5,ph:0,tilt:.4},{a:2.25,b:.8,sp:-.33,ph:2,tilt:-.7},{a:1.6,b:1.1,sp:.8,ph:4,tilt:1.2}];
  let mode="idle",energy=0,target=0,t=0,rot=0,level=0,flashC=null,flashT=0;
  function flash(c){flashC=c;flashT=1;}
  function setMode(m,label){mode=m;target=m==="idle"?0:m==="listen"?.55:m==="think"?.7:.95;const s=$("status");s.textContent=label;s.classList.toggle("on",m!=="idle");}

  // smooth pseudo-noise from layered sines: organic, cheap, deterministic
  function blob(x,y,z,tt){return Math.sin(x*3.1+tt*1.3)*Math.sin(y*2.7-tt*.9)*.5+Math.sin(z*4.2+tt*1.7+x*1.5)*.3+Math.sin((x+y+z)*5.3-tt*2.1)*.2;}

  function frame(){
    t+=reduce?.004:.016;
    const goal=Math.max(target, mode==="listen"? .35+level*1.8 : 0);
    energy+=(Math.min(goal,1.5)-energy)*.1;
    rot+=.003+energy*.014;
    if(flashT>0) flashT=Math.max(0,flashT-.02);

    // space
    sx.fillStyle="#02040a";sx.fillRect(0,0,SW,SH);
    const neb=sx.createRadialGradient(SW*.5,SH*.42,0,SW*.5,SH*.42,Math.max(SW,SH)*.7);
    neb.addColorStop(0,`rgba(40,${90+energy*40|0},120,${.22+energy*.08})`);neb.addColorStop(.45,"rgba(60,30,110,.10)");neb.addColorStop(1,"rgba(2,4,10,0)");
    sx.fillStyle=neb;sx.fillRect(0,0,SW,SH);
    for(const s of stars){s.y+=(.02+s.z*.08)*(1+energy*3);if(s.y>SH){s.y=0;s.x=Math.random()*SW;}
      const a=(.25+s.z*.6)*(.6+.4*Math.sin(t*2+s.tw));sx.fillStyle=`rgba(${200+s.z*55|0},${230},${255},${a})`;const r=.4+s.z*1.1;sx.fillRect(s.x,s.y,r,r);}

    // core
    ctx.clearRect(0,0,W,H);
    const cx=W/2,cy=H/2-6,R=Math.min(W,H)*.27*(1+energy*.1);
    // glyph ring
    ctx.save();ctx.translate(cx,cy);ctx.rotate(-t*.06);
    ctx.font=`${Math.max(9,R*.11)}px "IBM Plex Mono", monospace`;ctx.textAlign="center";ctx.textBaseline="middle";
    for(let i=0;i<ring.length;i++){const a=i/ring.length*6.283,rr=R*1.72;ctx.save();ctx.rotate(a);ctx.translate(0,-rr);
      const on=(Math.sin(t*3+i*.9)+1)/2;ctx.fillStyle=`rgba(76,255,210,${.12+on*.35*(.4+energy)})`;ctx.fillText(ring[i],0,0);ctx.restore();}
    ctx.restore();
    if(Math.random()<.02) ring[(Math.random()*ring.length)|0]=GLYPHS[(Math.random()*GLYPHS.length)|0];
    // broken arcs
    ctx.lineWidth=1;
    [[1.45,.16,.7,2.4],[1.32,.22,-1.1,1.2],[1.98,.08,.25,4.4]].forEach(([k,a,sp,len])=>{const st=t*sp*(.5+energy);
      ctx.strokeStyle=`rgba(155,123,255,${a+energy*.15})`;ctx.beginPath();ctx.arc(cx,cy,R*k,st,st+len);ctx.stroke();});
    // halo
    const g=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R*1.5);
    const fc=flashC&&flashT>0?flashC:[76,255,210];
    g.addColorStop(0,`rgba(${fc[0]},${fc[1]},${fc[2]},${.14+energy*.2+flashT*.3})`);g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.5,0,6.283);ctx.fill();
    // moons (behind / in front handled by depth)
    const moonPts=moons.map(m=>{const a=t*m.sp+m.ph,x=Math.cos(a)*m.a,z=Math.sin(a)*m.b,y=x*Math.sin(m.tilt)*.4;return [x,y,z];});
    // particles
    const cY=Math.cos(rot),sY=Math.sin(rot),cX=Math.cos(.38),sX=Math.sin(.38),P=[];
    const amp=.07+energy*.28;
    for(const p of pts){
      const n=blob(p.x,p.y,p.z,t*(1+energy));
      const w=1+amp*n+(mode==="listen"?level*.25*Math.sin(p.s+t*12):0)+(mode==="speak"?.08*Math.sin(t*14+p.y*6):0)+(mode==="think"?.05*Math.sin(t*6+p.s):0);
      const x=p.x*w,y=p.y*w,z=p.z*w;
      const x1=x*cY-z*sY,z1=x*sY+z*cY,y1=y*cX-z1*sX,z2=y*sX+z1*cX,ps=1.9/(2.6-z2);
      P.push([cx+x1*R*ps,cy+y1*R*ps,z2,ps,n]);
    }
    // tendrils on the front face
    if(energy>.04){ctx.lineWidth=.6;ctx.beginPath();ctx.strokeStyle=`rgba(155,123,255,${Math.min(energy,1)*.14})`;
      for(let i=0;i<N;i+=2){const a=P[i],b=P[(i+21)%N];if(a[2]>.1&&b[2]>.1){ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}}ctx.stroke();}
    for(const [x,y,z,ps,n] of P){
      const d=(z+1)/2;
      // iridescent: hue drifts teal → violet with surface "noise" and time
      const h=170+((n+1)/2)*110+Math.sin(t*.7)*15;
      let al=.12+d*.8;
      let col;
      if(mode==="speak"&&d>.62){col=`rgba(255,${190+((n+1)*30|0)},${120+((n+1)*40|0)},${al})`;}
      else if(flashT>0&&d>.55&&flashC){col=`rgba(${flashC[0]},${flashC[1]},${flashC[2]},${al})`;}
      else col=`hsla(${h},100%,${62+d*14}%,${al})`;
      ctx.fillStyle=col;const r=(.5+d*1.6)*ps;ctx.fillRect(x-r/2,y-r/2,r,r);
    }
    // eye: inner singularity
    const eye=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.32);
    eye.addColorStop(0,`rgba(230,255,250,${.5+energy*.4})`);eye.addColorStop(.25,`rgba(76,255,210,${.25+energy*.3})`);eye.addColorStop(1,"rgba(76,255,210,0)");
    ctx.fillStyle=eye;ctx.beginPath();ctx.arc(cx,cy,R*.32,0,6.283);ctx.fill();
    // moons
    for(const [x,y,z] of moonPts){const x1=x*cY-z*sY,z1=x*sY+z*cY,ps=1.9/(2.6-z1*.5),d=(z1+2.3)/4.6;
      ctx.fillStyle=`rgba(216,246,240,${.3+d*.6})`;const r=1.4+d*2.2;ctx.beginPath();ctx.arc(cx+x1*R*ps,cy+y*R*ps,r,0,6.283);ctx.fill();}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- mic level ---------- */
  let stream=null,actx=null,analyser=null,buf=null,meterOn=false;
  async function startMeter(){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      actx=new (window.AudioContext||window.webkitAudioContext)();const src=actx.createMediaStreamSource(stream);analyser=actx.createAnalyser();analyser.fftSize=512;src.connect(analyser);
      buf=new Uint8Array(analyser.fftSize);meterOn=true;meter();}catch(e){meterOn=false;}}
  function meter(){if(!meterOn){level=0;return;}analyser.getByteTimeDomainData(buf);let s=0;for(const v of buf){const d=(v-128)/128;s+=d*d;}
    level=level*.7+Math.sqrt(s/buf.length)*.3;requestAnimationFrame(meter);}
  function stopMeter(){meterOn=false;level=0;try{stream&&stream.getTracks().forEach(t=>t.stop());}catch(e){}try{actx&&actx.close();}catch(e){}stream=actx=null;}

  /* ---------- speech recognition ---------- */
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null,listening=false,finalText="",retried=false;
  const note=(txt,warn)=>{$("note").textContent=txt||"";$("note").classList.toggle("warn",!!warn);};
  if(!SR) note("Questo browser non trascrive la voce: usa Safari o Chrome, oppure il microfono della tastiera.",true);
  let lastAnswer="";
  function render(interim){
    const h=$("heard");h.textContent="";const idle=!finalText&&!interim&&!lastAnswer;h.classList.toggle("idle",idle);
    if(idle) h.textContent=listening?"Ti ascolto…":greeting;
    else if(listening||interim||(finalText&&!lastAnswer)){h.append(document.createTextNode(finalText));if(interim){const s=document.createElement("span");s.className="interim";s.textContent=(finalText?" ":"")+interim;h.append(s);}}
    else{const y=document.createElement("span");y.className="you";y.textContent=finalText;h.append(y,document.createTextNode(lastAnswer));}
    const has=!!(finalText.trim()||history.length);["send","clear"].forEach(id=>$(id).disabled=!has);
  }
  render("");
  function handleFinal(){
    const cmd=parseAdd(finalText);
    if(cmd){addTask(cmd.t,cmd.p);note(`Aggiunta in ${PNAME[cmd.p]}: ${cmd.t}`);lastAnswer="";speak(`Fatto. Aggiunta in ${PNAME[cmd.p]}.`,()=>setMode("idle","Tocca il nucleo"));finalText="";render("");return true;}
    return false;
  }
  async function listen(){
    closeSheet();
    if(!SR){$("q").focus();return;}
    if(listening){rec&&rec.stop();return;}
    try{speechSynthesis&&speechSynthesis.cancel();}catch(e){}
    finalText="";lastAnswer="";render("");
    rec=new SR();rec.lang="it-IT";rec.interimResults=true;rec.continuous=false;
    rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=(finalText?" ":"")+r[0].transcript.trim();else interim+=r[0].transcript;}render(interim);};
    rec.onerror=e=>{
      if((e.error==="audio-capture"||e.error==="aborted")&&meterOn&&!retried){retried=true;stopMeter();listening=false;setTimeout(listen,150);return;}
      if(e.error==="not-allowed"||e.error==="service-not-allowed") note("Microfono non autorizzato. iPhone: Impostazioni › Safari › Microfono, e Privacy › Riconoscimento vocale.",true);
      else if(e.error==="no-speech") note("Non ho sentito nulla. Tocca di nuovo il nucleo.");
    };
    rec.onend=()=>{listening=false;stopMeter();
      if(!finalText){setMode("idle","Tocca il nucleo");render("");return;}
      if(handleFinal()){setMode("idle","Attività registrata");return;}
      ask(finalText);};
    try{if(!retried) await startMeter();rec.start();listening=true;setMode("listen","In ascolto");note("");}
    catch(e){listening=false;stopMeter();setMode("idle","Tocca il nucleo");}
  }
  try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}catch(e){}
  cv.addEventListener("click",listen);
  cv.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();listen();}});

  /* ---------- brain (Claude API via /api/chat) ---------- */
  function findTask(text){const q=text.toLowerCase();let best=null,score=0;
    for(const x of tasks){if(x.done)continue;const w=x.t.toLowerCase();let s=0;for(const tok of q.split(/\W+/))if(tok.length>3&&w.includes(tok))s++;if(s>score){score=s;best=x;}}return best;}
  function applyActions(actions){const said=[];
    for(const a of actions||[]){
      if(a.name==="add_task"&&a.input&&a.input.text){const p=[1,2,3,4].includes(+a.input.priority)?+a.input.priority:2;addTask(String(a.input.text),p);said.push(`Aggiunta in ${PNAME[p]}.`);}
      if(a.name==="complete_task"&&a.input&&a.input.text){const x=findTask(String(a.input.text));if(x){x.done=true;save();renderTabs();renderSheet();said.push("Segnata come fatta.");}}
    }return said.join(" ");}
  async function ask(text){
    text=text.trim();if(!text||busy)return;busy=true;finalText=text;lastAnswer="";render("");
    setMode("think","Elaborazione");note("");
    history.push({role:"user",content:text});
    try{
      const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({messages:history.slice(-12),tasks:tasks.filter(x=>!x.done).map(x=>({t:x.t,p:x.p}))})});
      const data=await r.json().catch(()=>({}));
      if(!r.ok){history.pop();lastAnswer="";render("");setMode("idle","Tocca il nucleo");
        note(data.error==="missing_key"?"Cervello non ancora collegato: manca la chiave API su Vercel.":(data.message||"Risposta non arrivata. Riprova."),true);busy=false;return;}
      const extra=applyActions(data.actions);
      const answer=(data.text||extra||"Fatto.").trim();
      history.push({role:"assistant",content:answer});
      lastAnswer=answer;render("");
      speak(answer,()=>setMode("idle","Tocca il nucleo"));
      if(!voiceOn)setMode("idle","Tocca il nucleo");
    }catch(e){history.pop();setMode("idle","Tocca il nucleo");note("Connessione assente. Riprova.",true);}
    busy=false;
  }
  $("voice").setAttribute("aria-pressed",String(voiceOn));$("voice").textContent=voiceOn?"Voce on":"Voce off";
  $("voice").addEventListener("click",()=>{voiceOn=!voiceOn;$("voice").setAttribute("aria-pressed",String(voiceOn));$("voice").textContent=voiceOn?"Voce on":"Voce off";
    try{localStorage.setItem("argo-voice",voiceOn?"1":"0");}catch(e){}if(!voiceOn){try{speechSynthesis.cancel();}catch(e){}setMode("idle","Tocca il nucleo");}});

  /* ---------- hand-off to Claude ---------- */
  function openLink(url){const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();}
  function sendToArgo(text){text=text.trim();if(!text)return;setMode("send","Trasmissione");
    try{navigator.clipboard&&navigator.clipboard.writeText(text).catch(()=>{});}catch(e){}
    note("Frase copiata. Nel progetto ARGO apri una nuova chat e incolla.");openLink(PROJECT);setTimeout(()=>setMode("idle","Tocca il nucleo"),2500);}
  function quickChat(text){text=text.trim();if(!text)return;setMode("send","Trasmissione");
    openLink("https://claude.ai/new?q="+encodeURIComponent("ARGO, "+text));setTimeout(()=>setMode("idle","Tocca il nucleo"),2500);}
  $("send").addEventListener("click",()=>{const last=history.filter(m=>m.role==="user").slice(-1)[0];sendToArgo(last?last.content:finalText);});
  $("clear").addEventListener("click",()=>{history=[];finalText="";lastAnswer="";note("");try{speechSynthesis.cancel();}catch(e){}setMode("idle","Tocca il nucleo");render("");});
  $("typed").addEventListener("submit",e=>{e.preventDefault();const v=$("q").value.trim();if(!v)return;$("q").value="";$("q").blur();finalText=v;
    if(handleFinal())return; ask(v);});
})();
</script>
</body>
