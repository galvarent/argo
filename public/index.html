<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>ARGO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#04060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARGO">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060b; --ink:#e8f1f5; --dim:#7d8b97; --line:rgba(140,200,220,.14);
  --acc:#5ee6d0; --acc-rgb:94,230,208;
  --amber:#ffb454; --viola:#a493ff; --rosso:#ff6b6b;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:Michroma,ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}

/* sfondo */
.sfondo{position:fixed;inset:0;pointer-events:none;
  background:
   radial-gradient(60% 45% at 50% 38%, rgba(var(--acc-rgb),.13), transparent 70%),
   radial-gradient(90% 60% at 50% 110%, rgba(60,90,160,.18), transparent 70%);
  transition:background .6s}
.griglia{position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(75% 60% at 50% 40%,#000 0,transparent 75%);-webkit-mask-image:radial-gradient(75% 60% at 50% 40%,#000 0,transparent 75%)}

#app{position:relative;height:100dvh;display:flex;flex-direction:column;padding:calc(var(--sat) + 10px) 18px calc(var(--sab) + 10px);max-width:560px;margin:0 auto}

/* testata */
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:15px;display:flex;align-items:center;gap:9px}
.logo i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:battito 2.4s infinite}
@keyframes battito{50%{opacity:.35}}
.ora{font-size:9.5px;color:var(--dim);text-align:right;line-height:1.7}
.ora b{display:block;color:var(--ink);font-size:13px;font-weight:400;letter-spacing:.12em}
.icona{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;color:var(--dim)}
.icona svg{width:17px;height:17px}
.spie{display:flex;gap:12px;font-size:7.5px;color:var(--dim);margin-top:10px}
.spie span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#394450;margin-right:5px;vertical-align:1px}
.spie .ok::before{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.spie .ko::before{background:var(--rosso)}

/* nucleo */
.scena{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.nucleo{position:relative;width:min(74vw,330px);aspect-ratio:1;display:grid;place-items:center;touch-action:manipulation}
.nucleo canvas{position:absolute;inset:-12%;width:124%;height:124%}
.anello{position:absolute;inset:4%;border-radius:50%;border:1px solid rgba(var(--acc-rgb),.22);transition:border-color .5s}
.anello.b{inset:-5%;border-style:dashed;border-color:rgba(var(--acc-rgb),.12);animation:gira 60s linear infinite}
.anello.c{inset:13%;border-color:transparent;border-top-color:rgba(var(--acc-rgb),.55);border-bottom-color:rgba(var(--acc-rgb),.18);animation:gira 9s linear infinite reverse}
@keyframes gira{to{transform:rotate(360deg)}}
.stato{margin-top:6px;font-size:9px;color:rgb(var(--acc-rgb));height:16px;transition:color .4s}

/* testo */
.parlato{width:100%;min-height:118px;max-height:30dvh;overflow-y:auto;text-align:center;padding:6px 4px 0;scrollbar-width:none}
.parlato::-webkit-scrollbar{display:none}
.tu{font-size:13px;color:var(--dim);min-height:18px;margin-bottom:8px;font-weight:300}
.tu::before{content:"› "}
.tu:empty::before{content:""}
.argo{font-size:18px;line-height:1.45;font-weight:300;white-space:pre-line}
.argo .cursore{display:inline-block;width:8px;height:1em;background:var(--acc);vertical-align:-2px;margin-left:3px;animation:battito 1s infinite}

/* comandi */
.rapidi{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.rapidi::-webkit-scrollbar{display:none}
.rapidi button{flex:none;font-size:8.5px;padding:11px 14px;border:1px solid var(--line);border-radius:999px;color:#b9c6cf;background:rgba(255,255,255,.025);backdrop-filter:blur(6px)}
.rapidi button:active{border-color:var(--acc);color:var(--acc)}
.barra{display:flex;gap:8px;align-items:center}
.barra input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--ink);padding:0 16px;font:300 15px Sora,sans-serif;outline:none}
.barra input:focus{border-color:rgba(var(--acc-rgb),.6)}
.barra input::placeholder{color:#55626d}
.barra .icona{height:48px;width:48px;border-radius:14px}
.barra .icona.on{color:var(--bg);background:var(--acc);border-color:var(--acc)}

/* schede */
.velo{position:fixed;inset:0;background:rgba(2,4,8,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
.foglio{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:560px;margin:0 auto;max-height:82dvh;overflow-y:auto;
  background:linear-gradient(180deg,#0b111a,#070b12);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding:10px 18px calc(var(--sab) + 22px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.foglio.su{transform:none}.aperto .velo{opacity:1;pointer-events:auto}
.maniglia{width:38px;height:4px;border-radius:4px;background:#2a3542;margin:0 auto 14px}
.foglio h2{font:400 9px Michroma,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:18px 0 10px;display:flex;justify-content:space-between}
.foglio h2 small{color:var(--dim);font-size:8px}
.carta{border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;background:rgba(255,255,255,.02);display:flex;gap:12px;align-items:center}
.carta .giorno{flex:none;width:46px;text-align:center;font:400 8px Michroma,monospace;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.carta .giorno b{display:block;font-size:19px;color:var(--ink);letter-spacing:0;font-weight:400;margin-top:2px}
.carta .corpo{flex:1;min-width:0;font-size:14px;line-height:1.35}
.carta .corpo small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px;font-weight:300}
.carta .corpo em{font-style:normal;color:var(--amber)}
.etichetta{font:400 7px Michroma,monospace;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid currentColor;color:var(--acc);margin-right:6px}
.etichetta.pu{color:var(--viola)} .etichetta.critico{color:var(--rosso)}
.spunta{flex:none;width:26px;height:26px;border-radius:9px;border:1.5px solid #3a4756}
.spunta:active{background:var(--acc);border-color:var(--acc)}
.vuoto{color:var(--dim);font-size:13px;font-weight:300;padding:6px 2px 10px;line-height:1.5}
.riga{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.riga small{display:block;color:var(--dim);font-size:11.5px;font-weight:300;margin-top:2px}
.riga select,.riga input[type=range]{background:#0e1620;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;max-width:170px;font:inherit;font-size:13px}
.leva{flex:none;width:48px;height:28px;border-radius:99px;background:#1a2430;position:relative;transition:background .2s}
.leva::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#7d8b97;transition:.2s}
.leva.on{background:rgba(var(--acc-rgb),.35)}.leva.on::after{left:23px;background:var(--acc)}
.testo-btn{font:400 8.5px Michroma,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:14px 0}

/* blocco */
#blocco{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px}
#blocco h1{font:400 26px Michroma,monospace;letter-spacing:.4em;margin:0;padding-left:.4em}
#blocco p{color:var(--dim);font-size:9px;margin:0}
#blocco input{width:230px;height:54px;text-align:center;font:400 20px Sora;letter-spacing:.3em;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;outline:none}
#blocco input:focus{border-color:var(--acc)}
#blocco .err{color:var(--rosso);min-height:14px}
#blocco button{font-size:10px;padding:16px 34px;border:1px solid var(--acc);color:var(--acc);border-radius:99px}
.nascosto{display:none!important}

/* stati */
body[data-stato=ascolto]{--acc:#ffb454;--acc-rgb:255,180,84}
body[data-stato=penso]{--acc:#a493ff;--acc-rgb:164,147,255}
body[data-stato=errore]{--acc:#ff6b6b;--acc-rgb:255,107,107}
@media (prefers-reduced-motion:reduce){.anello,.logo i{animation:none}}
</style>
</head>
<body data-stato="pronto">
<div class="sfondo"></div><div class="griglia"></div>

<div id="blocco">
  <h1>ARGO</h1>
  <p class="mono">Accesso riservato</p>
  <input id="pin" type="password" autocomplete="current-password" placeholder="PIN" enterkeyhint="go">
  <p class="mono err" id="pinErr"></p>
  <button class="mono" id="pinOk">Sblocca</button>
</div>

<div id="app">
  <header>
    <div>
      <div class="logo mono"><i></i>ARGO</div>
      <div class="spie mono"><span id="sCervello">Cervello</span><span id="sDb">Dati</span><span id="sVoce">Voce</span></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="ora mono"><b id="orologio">--:--</b><span id="data"></span></div>
      <button class="icona" id="apriImp" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <div class="scena">
    <button class="nucleo" id="nucleo" aria-label="Parla con ARGO">
      <span class="anello b"></span><span class="anello"></span><span class="anello c"></span>
      <canvas id="tela"></canvas>
    </button>
    <div class="stato mono" id="stato">Tocca e parla</div>
  </div>

  <div class="parlato" id="parlato">
    <div class="tu" id="tu"></div>
    <div class="argo" id="argo"></div>
  </div>

  <div class="rapidi" id="rapidi">
    <button class="mono" data-q="Protocollo mattina">Mattina</button>
    <button class="mono" data-q="Cosa ho in agenda oggi e domani?">Agenda</button>
    <button class="mono" data-q="Quali sono le prossime partite del Tavernola?">Partite</button>
    <button class="mono" data-q="Quali promemoria ho aperti?">Promemoria</button>
    <button class="mono" data-q="Riepilogo dei lead e delle trattative aperte">Lead</button>
    <button class="mono" data-q="Check volo">Check volo</button>
    <button class="mono" data-q="Modalità campo">Campo</button>
    <button class="mono" data-q="Debrief: ti racconto la giornata">Debrief</button>
  </div>

  <form class="barra" id="modulo">
    <button type="button" class="icona" id="apriSchede" aria-label="Schede"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/></svg></button>
    <input id="campo" placeholder="Scrivi ad ARGO" autocomplete="off" enterkeyhint="send">
    <button type="button" class="icona" id="mani" aria-label="Mani libere"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12c2-6 4-6 6 0s4 6 6 0 3-4 4-2"/></svg></button>
  </form>
</div>

<div class="velo" id="velo"></div>
<section class="foglio" id="schede">
  <div class="maniglia"></div>
  <h2>Prossime partite <small>US Tavernola</small></h2><div id="lPartite"></div>
  <h2>Promemoria <small id="nProm"></small></h2><div id="lProm"></div>
</section>
<section class="foglio" id="imp">
  <div class="maniglia"></div>
  <h2>Voce</h2>
  <div class="riga"><div>Risposta a voce</div><button class="leva" id="oVoce"></button></div>
  <div class="riga"><div>Voce</div><select id="oQuale"></select></div>
  <div class="riga"><div>Velocità</div><input type="range" id="oVel" min="0.8" max="1.4" step="0.05"></div>
  <h2>Ascolto</h2>
  <div class="riga"><div>Mani libere<small>Ad app aperta, di' «ARGO» e poi la richiesta</small></div><button class="leva" id="oMani"></button></div>
  <div class="riga"><div>Conversazione continua<small>Dopo la risposta torna in ascolto</small></div><button class="leva" id="oCont"></button></div>
  <h2>Accesso</h2>
  <button class="testo-btn" id="esci">Blocca ed esci</button>
</section>

<script>
(() => {
const $ = (id) => document.getElementById(id);
const mem = {
  get(k, d) { try { const v = localStorage.getItem('argo_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('argo_' + k, JSON.stringify(v)); } catch {} },
};
let pin = mem.get('pin', '');
const opz = { voce: mem.get('voce', true), quale: mem.get('quale', ''), vel: mem.get('vel', 1.05), mani: false, cont: mem.get('cont', false) };
let stato = 'pronto', storia = [], energia = 0;

const ETI = { pronto: 'Tocca e parla', ascolto: 'In ascolto', penso: 'Elaboro', parlo: 'ARGO', errore: 'Errore', attesa: 'Di’ «ARGO»' };
function setStato(s, testo) {
  stato = s;
  document.body.dataset.stato = s === 'attesa' ? 'pronto' : s;
  $('stato').textContent = testo || ETI[s] || '';
}

/* ---------- nucleo: sfera di particelle ---------- */
const tela = $('tela'), cx = tela.getContext('2d');
const N = 900, punti = [];
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), t = i * 2.399963;
  punti.push({ x: Math.cos(t) * r, y, z: Math.sin(t) * r, f: Math.random() * 6.28 });
}
let W = 0, H = 0, DPR = 1, rot = 0;
function misura() {
  DPR = Math.min(devicePixelRatio || 1, 2.5);
  const b = tela.getBoundingClientRect();
  W = tela.width = b.width * DPR; H = tela.height = b.height * DPR;
}
addEventListener('resize', misura);
const fermo = matchMedia('(prefers-reduced-motion:reduce)').matches;
function disegna(ms) {
  const t = ms / 1000;
  const bersaglio = { pronto: .08, attesa: .12, ascolto: .55, penso: .35, parlo: .7, errore: .1 }[stato] || .1;
  energia += (bersaglio - energia) * .06;
  const rgb = getComputedStyle(document.body).getPropertyValue('--acc-rgb').trim() || '94,230,208';
  rot += fermo ? 0 : (.0025 + energia * .012);
  cx.clearRect(0, 0, W, H);
  const R = Math.min(W, H) * .33, cxm = W / 2, cym = H / 2;
  const g = cx.createRadialGradient(cxm, cym, 0, cxm, cym, R * 1.25);
  g.addColorStop(0, `rgba(${rgb},${.16 + energia * .22})`); g.addColorStop(1, `rgba(${rgb},0)`);
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxm, cym, R * 1.25, 0, 6.29); cx.fill();
  const c = Math.cos(rot), s = Math.sin(rot), c2 = Math.cos(.38), s2 = Math.sin(.38);
  for (const p of punti) {
    const onda = stato === 'penso'
      ? Math.sin(t * 3 + p.y * 6) * .09
      : Math.sin(t * (1.2 + energia * 5) + p.f) * (.02 + energia * .16) + Math.sin(t * 7 + p.f * 3) * energia * .05;
    const k = 1 + onda;
    let x = p.x * c - p.z * s, z = p.x * s + p.z * c, y = p.y;
    const y2 = y * c2 - z * s2; z = y * s2 + z * c2; y = y2;
    const pr = 1 / (1.9 - z * .55), px = cxm + x * k * R * pr * 1.6, py = cym + y * k * R * pr * 1.6;
    const a = (.26 + (z + 1) * .42) * (.75 + energia * .5);
    cx.fillStyle = `rgba(${rgb},${Math.min(a, 1)})`;
    const d = (1 + (z + 1) * .9) * DPR * (.75 + energia * .5);
    cx.fillRect(px - d / 2, py - d / 2, d, d);
  }
  requestAnimationFrame(disegna);
}

/* ---------- voce in uscita ---------- */
const sint = window.speechSynthesis;
let voci = [], sbloccata = false;
function caricaVoci() {
  if (!sint) return;
  voci = sint.getVoices().filter((v) => /^it/i.test(v.lang));
  const sel = $('oQuale'); sel.innerHTML = '';
  voci.forEach((v) => { const o = document.createElement('option'); o.value = v.name; o.textContent = v.name.replace(/\s*\(.*\)/, ''); sel.appendChild(o); });
  if (!opz.quale && voci.length) opz.quale = (voci.find((v) => /premium|enhanced|migliorat|siri/i.test(v.name)) || voci[0]).name;
  sel.value = opz.quale;
  $('sVoce').className = sint ? 'ok' : 'ko';
}
if (sint) { caricaVoci(); sint.onvoiceschanged = caricaVoci; }
function sblocca() { // iOS: la sintesi parte solo dopo un tocco
  if (sbloccata || !sint) return; sbloccata = true;
  const u = new SpeechSynthesisUtterance(' '); u.volume = 0; sint.speak(u);
}
addEventListener('pointerdown', sblocca, { passive: true });
function parla(testo) {
  return new Promise((fine) => {
    if (!sint || !opz.voce || !testo) return fine();
    sint.cancel();
    const frasi = testo.match(/[^.!?\n]+[.!?]*\s*/g) || [testo];
    let i = 0;
    const guardia = setTimeout(fine, 90000);
    const prossima = () => {
      if (i >= frasi.length) { clearTimeout(guardia); return fine(); }
      const u = new SpeechSynthesisUtterance(frasi[i++].trim());
      u.lang = 'it-IT'; u.rate = opz.vel;
      const v = voci.find((x) => x.name === opz.quale); if (v) u.voice = v;
      u.onend = prossima; u.onerror = prossima;
      sint.speak(u);
    };
    prossima();
  });
}
function zitto() { if (sint) sint.cancel(); }

/* ---------- voce in ingresso ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let ric = null, attivo = false, buf = '', armato = false, timer = null;
function bip(f = 880) {
  try {
    const A = bip.c || (bip.c = new (window.AudioContext || window.webkitAudioContext)());
    const o = A.createOscillator(), g = A.createGain();
    o.frequency.value = f; o.connect(g); g.connect(A.destination);
    g.gain.setValueAtTime(.0001, A.currentTime); g.gain.exponentialRampToValueAtTime(.12, A.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, A.currentTime + .22);
    o.start(); o.stop(A.currentTime + .25);
  } catch {}
}
function ascolta() {
  if (!SR) { setStato('errore', 'Microfono non supportato'); $('argo').textContent = 'Questo browser non supporta il riconoscimento vocale. Apri ARGO in Safari oppure usa la dettatura della tastiera.'; return; }
  if (attivo) return;
  zitto();
  ric = new SR(); ric.lang = 'it-IT'; ric.interimResults = true; ric.continuous = opz.mani; ric.maxAlternatives = 1;
  buf = ''; attivo = true;
  ric.onstart = () => { if (opz.mani && !armato) setStato('attesa'); else { setStato('ascolto'); if (opz.mani) { clearTimeout(timer); timer = setTimeout(() => chiudi(''), 7000); } } };
  ric.onresult = (e) => {
    let t = '';
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
    buf = t.trim();
    let comando = buf;
    if (opz.mani && !armato) {
      const m = buf.match(/(?:^|\s)(?:ehi\s+|hey\s+)?argo\b[\s,.!?]*(.*)$/i);
      if (!m) return;               // parola di attivazione non ancora detta
      comando = m[1].trim();
      if (stato !== 'ascolto') { setStato('ascolto'); bip(); }
    }
    $('tu').textContent = comando; $('argo').textContent = '';
    clearTimeout(timer);
    timer = setTimeout(() => chiudi(comando), comando ? 1500 : 4000);
  };
  ric.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { opz.mani = false; aggiornaLeve(); setStato('errore', 'Microfono negato'); $('argo').textContent = 'Consenti microfono e riconoscimento vocale nelle impostazioni del browser.'; }
  };
  ric.onend = () => {
    attivo = false;
    if (stato === 'ascolto' && buf && !opz.mani) return chiudi(buf);
    if (opz.mani && (stato === 'attesa' || stato === 'ascolto')) return setTimeout(ascolta, 250); // resta in ascolto
    if (stato === 'ascolto' || stato === 'attesa') setStato('pronto');
  };
  try { ric.start(); } catch { attivo = false; }
}
function chiudi(comando) {
  clearTimeout(timer);
  const eraArmato = armato; armato = false;
  if (!comando) { // solo «ARGO»: la prossima frase è la richiesta
    if (opz.mani && !eraArmato) { armato = true; ferma(); setTimeout(ascolta, 200); }
    else { ferma(); setStato(opz.mani ? 'attesa' : 'pronto'); }
    return;
  }
  setStato('penso'); ferma(); invia(comando);
}
function ferma() { try { ric && ric.stop(); } catch {} }

/* ---------- conversazione ---------- */
let scrivendo = 0;
function scrivi(testo) {
  const el = $('argo'), id = ++scrivendo; el.textContent = '';
  const parole = testo.split(/(\s+)/); let i = 0;
  (function avanti() {
    if (id !== scrivendo) return;
    if (i >= parole.length) return;
    el.textContent += parole[i++]; $('parlato').scrollTop = 1e6;
    setTimeout(avanti, 26);
  })();
}
async function invia(testo) {
  testo = (testo || '').trim(); if (!testo) return;
  zitto(); ferma();
  $('tu').textContent = testo; $('argo').innerHTML = '<span class="cursore"></span>';
  setStato('penso');
  let risposta = '', ok = false;
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json', 'x-argo-pin': pin }, body: JSON.stringify({ text: testo, history: storia.slice(-10) }) });
    if (r.status === 401) { blocca('PIN non valido'); return; }
    const j = await r.json().catch(() => ({}));
    risposta = j.reply || j.error || 'Nessuna risposta.'; ok = r.ok;
  } catch { risposta = 'Non riesco a raggiungere il server. Controlla la connessione.'; }
  if (ok) { storia.push({ role: 'user', content: testo }, { role: 'assistant', content: risposta }); storia = storia.slice(-12); }
  setStato(ok ? 'parlo' : 'errore');
  scrivi(risposta);
  if (ok) caricaDati();
  await parla(risposta);
  if (stato !== 'parlo' && stato !== 'errore') return; // nel frattempo è partito altro
  if (opz.mani) { setStato('attesa'); ascolta(); }
  else if (opz.cont && ok) { ascolta(); }
  else setStato('pronto');
}

/* ---------- schede ---------- */
const GG = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function caricaDati() {
  try {
    const r = await fetch('/api/data', { headers: { 'x-argo-pin': pin } });
    if (r.status === 401) return blocca('PIN non valido'), false;
    const j = await r.json();
    if (!r.ok) { $('pinErr').textContent = j.error || ''; return false; }
    $('sCervello').className = j.stato.cervello ? 'ok' : 'ko';
    $('sDb').className = j.stato.database ? 'ok' : 'ko';
    $('lPartite').innerHTML = j.partite.map((p) => {
      const d = new Date(p.data + 'T12:00:00');
      return `<div class="carta"><div class="giorno">${GG[d.getDay()]}<b>${d.getDate()}</b></div><div class="corpo"><span class="etichetta ${/Pulcini/.test(p.squadra) ? 'pu' : ''}">${/Pulcini/.test(p.squadra) ? 'Pulcini' : 'Primi calci'}</span>${esc(p.ora)}<br>${esc(p.partita)}<small>${esc(p.luogo)}${p.nota ? ' · <em>' + esc(p.nota) + '</em>' : ''}</small></div></div>`;
    }).join('') || '<div class="vuoto">Nessuna partita in calendario.</div>';
    $('nProm').textContent = j.promemoria.length ? j.promemoria.length + ' aperti' : '';
    $('lProm').innerHTML = j.promemoria.map((t) => {
      const d = t.scadenza ? new Date(t.scadenza) : null;
      const quando = d ? d.toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'senza scadenza';
      const tardi = d && d < new Date();
      return `<div class="carta"><button class="spunta" data-id="${Number(t.id)}" aria-label="Fatto"></button><div class="corpo">${t.priorita === 'critico' ? '<span class="etichetta critico">Critico</span>' : ''}${esc(t.testo)}<small>${tardi ? '<em>Scaduto · </em>' : ''}${esc(quando)} · ${esc(t.area)}</small></div></div>`;
    }).join('') || `<div class="vuoto">${j.stato.database ? 'Nessun promemoria aperto. Dettane uno: «ARGO, ricordami di…»' : 'Database non ancora collegato: i promemoria si attivano appena aggiungi le chiavi Supabase su Vercel.'}</div>`;
    return true;
  } catch { return false; }
}
$('lProm').addEventListener('click', async (e) => {
  const b = e.target.closest('.spunta'); if (!b) return;
  b.closest('.carta').style.opacity = .3;
  await fetch('/api/data', { method: 'POST', headers: { 'content-type': 'application/json', 'x-argo-pin': pin }, body: JSON.stringify({ azione: 'fatto', id: Number(b.dataset.id) }) }).catch(() => {});
  caricaDati();
});
function apri(id) { document.querySelectorAll('.foglio').forEach((f) => f.classList.toggle('su', f.id === id)); document.body.classList.add('aperto'); }
function chiudiFogli() { document.querySelectorAll('.foglio').forEach((f) => f.classList.remove('su')); document.body.classList.remove('aperto'); }
$('apriSchede').onclick = () => { caricaDati(); apri('schede'); };
$('apriImp').onclick = () => apri('imp');
$('velo').onclick = chiudiFogli;
document.querySelectorAll('.maniglia').forEach((m) => (m.onclick = chiudiFogli));

/* ---------- impostazioni ---------- */
let sveglio = null;
function aggiornaLeve() {
  $('oVoce').classList.toggle('on', opz.voce); $('oMani').classList.toggle('on', opz.mani); $('oCont').classList.toggle('on', opz.cont);
  $('mani').classList.toggle('on', opz.mani); $('oVel').value = opz.vel;
}
async function maniLibere(on) {
  opz.mani = on; armato = false; aggiornaLeve();
  if (on) {
    try { sveglio = await navigator.wakeLock.request('screen'); } catch {}
    ferma(); attivo = false; setStato('attesa'); ascolta();
  } else {
    try { sveglio && sveglio.release(); } catch {} sveglio = null;
    ferma(); setStato('pronto');
  }
}
$('oVoce').onclick = () => { opz.voce = !opz.voce; mem.set('voce', opz.voce); if (!opz.voce) zitto(); aggiornaLeve(); };
$('oCont').onclick = () => { opz.cont = !opz.cont; mem.set('cont', opz.cont); aggiornaLeve(); };
$('oMani').onclick = () => maniLibere(!opz.mani);
$('mani').onclick = () => maniLibere(!opz.mani);
$('oQuale').onchange = (e) => { opz.quale = e.target.value; mem.set('quale', opz.quale); parla('Voce impostata.'); };
$('oVel').onchange = (e) => { opz.vel = Number(e.target.value); mem.set('vel', opz.vel); };
$('esci').onclick = () => { mem.set('pin', ''); pin = ''; chiudiFogli(); blocca(''); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { zitto(); if (opz.mani) maniLibere(false); } });

/* ---------- comandi ---------- */
$('nucleo').onclick = () => {
  if (stato === 'parlo') { zitto(); scrivendo++; setStato('pronto'); return; }
  if (stato === 'ascolto' && !opz.mani) { chiudi(buf); return; }
  if (stato === 'penso') return;
  if (opz.mani) { armato = true; ferma(); attivo = false; bip(); }
  ascolta();
};
$('rapidi').onclick = (e) => { const b = e.target.closest('button'); if (b) invia(b.dataset.q); };
$('modulo').onsubmit = (e) => { e.preventDefault(); const v = $('campo').value; $('campo').value = ''; $('campo').blur(); invia(v); };

/* ---------- orologio ---------- */
function tic() {
  const d = new Date();
  $('orologio').textContent = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  $('data').textContent = d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
}
setInterval(tic, 15000); tic();

/* ---------- accesso e avvio ---------- */
function blocca(msg) { $('blocco').classList.remove('nascosto'); $('pinErr').textContent = msg || ''; $('pin').value = ''; }
async function entra() {
  const ok = await caricaDati();
  if (!ok) { if (!$('pinErr').textContent) $('pinErr').textContent = pin ? 'PIN non valido' : ''; $('blocco').classList.remove('nascosto'); return; }
  mem.set('pin', pin);
  $('blocco').classList.add('nascosto');
  const p = new URLSearchParams(location.search);
  const q = p.get('q');
  if (q) { history.replaceState(null, '', '/'); invia(q); }
  else if (p.get('ascolta')) { history.replaceState(null, '', '/'); ascolta(); }
}
$('pinOk').onclick = () => { pin = $('pin').value.trim(); $('pinErr').textContent = ''; entra(); };
$('pin').onkeydown = (e) => { if (e.key === 'Enter') $('pinOk').click(); };

misura(); requestAnimationFrame(disegna); aggiornaLeve();
if (pin) entra();
})();
</script>
